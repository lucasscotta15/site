function startSession(treinoId) {
  const t = getTreino(treinoId);
  if (!t) return;
  state.sessao = {
    data: todayISO(),
    treinoId: treinoId,
    horaInicio: null,      // ISO — preenchido ao tocar em "Iniciar treino"
    horaFim: null,
    duracaoMin: null,
    exercicios: t.exercicios.map(ex => {
      const last = lastSeriesFor(ex.id);
      if (ex.tipo === "cardio") {
        return { exercicioId: ex.id, nome: ex.nome, tipo: "cardio", repsAlvo: ex.reps, concluido: false, obs: "",
          series: blankCardioSeries(ex.series, last), lastData: last ? last.data : null };
      }
      const series = [];
      for (let i = 0; i < ex.series; i++) {
        const prev = last && last.series[i];
        series.push({ peso: prev && prev.peso != null ? String(prev.peso) : "", reps: ex.tipo === "reps" ? "" : "", prev: prev ? prev.peso : null });
      }
      return { exercicioId: ex.id, nome: ex.nome, tipo: ex.tipo, repsAlvo: ex.reps, concluido: false, obs: "", series, lastData: last ? last.data : null };
    }),
  };
  state.openEx = {};
  state.tab = "inicio";
  saveSessaoRascunho();
  render();
}

function blankSeries(n, tipo) {
  if (tipo === "cardio") return blankCardioSeries(n, null);
  return Array.from({ length: n }, () => ({ peso: "", reps: tipo === "reps" ? "" : "", prev: null }));
}

function renderSessao(v) {
  const s = state.sessao;
  const t = getTreino(s.treinoId);
  const head = el("div", { class: "card", style: "margin-top:14px" });
  head.innerHTML = `
    <div class="row">
      <span class="badge" style="font-size:13px; padding:5px 9px">${esc(s.treinoId)}</span>
      <div><div style="font-weight:700">${esc(t ? t.nome : "Treino")}</div>
      <div class="tiny">${t ? t.exercicios.length : s.exercicios.length} exercícios</div></div>
      <span class="sp"></span>
      <div style="position:relative; text-align:right">
        <button class="btn sm" id="date-btn" style="min-height:38px; font-size:13px; padding:0 10px" aria-label="Mudar data do treino">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
          ${fmtBR(s.data)}
        </button>
        <input type="date" id="sess-date" value="${s.data}" aria-label="Data do treino"
          style="position:absolute; inset:0; width:100%; height:100%; opacity:0; pointer-events:none">
      </div>
    </div>`;
  v.appendChild(head);
  $("#sess-date", head).addEventListener("change", (e) => {
    s.data = e.target.value || todayISO();
    saveSessaoRascunho();
    render();
  });
  $("#date-btn", head).addEventListener("click", () => {
    const inp = $("#sess-date", head);
    if (inp.showPicker) { try { inp.showPicker(); return; } catch (e) {} }
    inp.style.pointerEvents = "auto"; inp.focus(); inp.click();
  });

  // ---- cronômetro ----
  v.appendChild(timerCard(s));

  // ---- contador de concluídos ----
  const prog = el("div", { class: "card", style: "padding:12px 14px" });
  prog.id = "prog-card";
  const n = totalEx(s), d = doneEx(s);
  prog.innerHTML = `<div class="row"><div style="flex:1">
      <div style="font-size:14px"><b>${d} de ${n}</b> <span class="muted">concluídos</span></div>
      ${d < n ? `<div class="tiny">Marque ✓ em cada exercício pelo nome para liberar a finalização.</div>` : `<div class="tiny" style="color:var(--acc)">Tudo concluído — pode finalizar!</div>`}
    </div><span class="chip" style="background:${d === n && n ? "rgba(74,222,128,.16)" : "var(--bg3)"}; color:${d === n && n ? "var(--acc)" : "var(--txt)"}">${d}/${n}</span></div>
    <div class="prog"><i style="width:${n ? Math.round((d / n) * 100) : 0}%"></i></div>`;
  v.appendChild(prog);

  for (const ex of s.exercicios) {
    v.appendChild(exCard(ex));
  }

  const act = el("div");
  act.style.margin = "16px 0 10px";
  const bSave = el("button", { class: "btn pri block", style: "min-height:58px" }, "⏱ Finalizar treino");
  bSave.id = "btn-finish";
  bSave.addEventListener("click", finalizarTreino);
  act.appendChild(bSave);
  const bCancel = el("button", { class: "btn block danger" }, "Cancelar treino");
  bCancel.addEventListener("click", () => {
    if (confirm("Descartar este treino em andamento?")) { stopTick(); state.sessao = null; clearRascunho(); render(); }
  });
  act.appendChild(bCancel);
  v.appendChild(act);

  startTick();
}

/* ---------- cronômetro ---------- */
function iniciarTreino() {
  const s = state.sessao;
  if (!s) return;
  s.horaInicio = new Date().toISOString();
  saveSessaoRascunho();
  render();
  toast("Treino iniciado às " + fmtHora(s.horaInicio));
}

function timerCard(s) {
  const c = el("div", { class: "card timer-card" });
  const iniciado = !!s.horaInicio;
  const seg = elapsedSec(s);
  c.innerHTML = `
    <div class="row">
      <div style="flex:1; min-width:0">
        <div class="clock-lbl">${iniciado ? "Tempo de treino" : "Cronômetro"}</div>
        <div class="clock ${iniciado ? "run" : "stopped"}" id="clock">${iniciado ? fmtClock(seg) : "--:--"}</div>
      </div>
      <span class="chip" style="${iniciado ? "border-color:rgba(74,222,128,.45); color:var(--acc)" : ""}">
        ${iniciado ? `<i class="dot ok" style="animation:blink 1.4s infinite"></i>em andamento` : "não iniciado"}
      </span>
    </div>
    <div class="metarow" style="margin-top:8px">
      <span>Início: <b>${iniciado ? fmtHora(s.horaInicio) : "—"}</b></span>
      ${s.horaFim ? `<span>Fim: <b>${fmtHora(s.horaFim)}</b></span>` : ""}
    </div>`;
  if (!iniciado) {
    const b = el("button", { class: "btn pri block", id: "btn-start", style: "min-height:56px; margin-top:10px" }, "▶ Iniciar treino");
    b.addEventListener("click", iniciarTreino);
    c.appendChild(b);
    const hint = el("p", { class: "tiny", style: "margin:8px 0 0" }, "O cronômetro começa a contar na hora em que você tocar aqui.");
    c.appendChild(hint);
  }
  return c;
}

/** atualiza só o texto do relógio (não re-renderiza a tela) */
function startTick() {
  stopTick();
  if (!state.sessao || !state.sessao.horaInicio) return;
  state.tickTimer = setInterval(() => {
    const cl = $("#clock");
    if (!cl) { stopTick(); return; }
    if (!state.sessao || !state.sessao.horaInicio) return;
    cl.textContent = fmtClock(elapsedSec(state.sessao));
  }, 1000);
}
function stopTick() { if (state.tickTimer) { clearInterval(state.tickTimer); state.tickTimer = null; } }

function exCard(ex) {
  const open = !!state.openEx[ex.exercicioId];
  const feito = !!ex.concluido;
  const c = el("div", { class: "ex-card" + (open ? " open" : "") + (feito ? " feito" : "") });
  const isCardio = ex.tipo === "cardio";
  const last = lastSeriesFor(ex.exercicioId);
  const best = isCardio ? null : bestWeight(ex.exercicioId);
  const stag = isCardio ? null : loadStagnation(ex.exercicioId, state.sessao ? state.sessao.data : todayISO());
  const obsPrev = obsHistoryFor(ex.exercicioId);
  const head = el("div", { class: "ex-head", style: "display:flex; align-items:center; gap:10px" });
  const chk = el("button", {
    class: "chk" + (feito ? " on" : ""), type: "button",
    "aria-label": (feito ? "Desmarcar" : "Marcar como concluído") + ": " + ex.nome,
    "aria-pressed": feito ? "true" : "false", title: feito ? "Concluído — toque para desmarcar" : "Marcar como concluído",
  }, "✓");
  chk.dataset.exid = ex.exercicioId;
  chk.classList.add("toggle-ex");
  chk.addEventListener("click", (e) => { e.stopPropagation(); toggleConcluido(ex); });
  head.appendChild(chk);

  const h = el("button", { class: "ex-head", style: "padding:0; flex:1; min-width:0; background:none; border:0; text-align:left" });
  h.innerHTML = `<div style="flex:1">
      <div class="name">${esc(ex.nome)} ${ex.tipo === "tempo" ? '<span class="badge tempo">tempo</span>' : ""}${isCardio ? '<span class="badge cardio">cardio</span>' : ""}</div>
      <div class="meta">${isCardio
        ? `${ex.series.length} série(s) · tempo + velocidade${last && last.series.some(v => v.velocidade != null) ? ` · último: <b style="color:var(--acc)">${fmtVel(cardioStats(last.series).velAvg)} km/h</b>` : ""}`
        : `${ex.series.length} × ${esc(ex.repsAlvo)}${last ? ` · último: <b style="color:var(--acc)">${last.series.map(v => v.peso ?? "–").join(" / ")} kg</b>` : ""}`}</div>
      ${stag ? `<span class="mini-warn" title="Mesmo peso desde ${fmtBR(stag.desde)}">⚠ Considere aumentar a carga</span>` : ""}
    </div>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>`;
  h.addEventListener("click", () => { state.openEx[ex.exercicioId] = !open; render(); });
  head.appendChild(h);
  c.appendChild(head);

  const body = el("div", { class: "ex-body" });
  if (isCardio) {
    renderCardioBody(body, ex, last);
    c.appendChild(body);
    return c;
  }
  if (last) {
    const l = el("div", { class: "last" });
    l.innerHTML = `Última vez (${fmtBR(last.data)}): <b>${last.series.map(v => (v.peso ?? "–") + (v.reps ? "×" + v.reps : "")).join(" · ")}</b>
      ${best != null ? ` &nbsp;|&nbsp; recorde: <b>${best} kg</b>` : ""}`;
    body.appendChild(l);
  }
  if (stag) {
    const w = el("div", { class: "load-warn" });
    w.innerHTML = `<span aria-hidden="true">⚠</span><div><b>Considere aumentar a carga.</b> Mesmo peso há ${stag.dias} dias
      (${stag.peso} kg desde ${fmtBR(stag.desde)} · ${stag.registros} registros).</div>`;
    body.appendChild(w);
  }
  // cabeçalho
  const hdr = el("div", { class: "setrow", style: "margin-top:10px" });
  hdr.innerHTML = `<span class="idx"></span><label class="f"><field>Peso (kg)</field></label><label class="f"><field>${ex.tipo === "tempo" ? "Segundos" : "Reps"}</field></label>`;
  body.appendChild(hdr);

  ex.series.forEach((se, i) => {
    const r = el("div", { class: "setrow" });
    r.innerHTML = `<span class="idx">${i + 1}ª</span>`;
    const ip = el("input", { type: "number", inputmode: "decimal", step: "0.5", min: "0", placeholder: se.prev != null ? String(se.prev) : "0", value: se.peso, "aria-label": `Peso série ${i + 1}` });
    ip.addEventListener("input", () => { se.peso = ip.value; saveSessaoRascunho(); });
    ip.addEventListener("change", () => { const p = num(ip.value); if (p != null) ip.value = p; });
    const ir = el("input", { type: "number", inputmode: "numeric", step: "1", min: "0", placeholder: String(ex.repsAlvo).replace(/\s*a\s*/g, "–") || "–", value: se.reps, "aria-label": `Reps série ${i + 1}` });
    ir.addEventListener("input", () => { se.reps = ir.value; saveSessaoRascunho(); });
    r.appendChild(ip); r.appendChild(ir);
    body.appendChild(r);
  });

  // copiar 1ª série
  const acts = el("div", { class: "row", style: "margin-top:10px" });
  const bCopy = el("button", { class: "btn sm" }, "Copiar 1ª para todas");
  bCopy.addEventListener("click", () => {
    const first = ex.series[0];
    if (first.peso === "") return toast("Preencha a 1ª série");
    ex.series.forEach(x => { x.peso = first.peso; if (first.reps !== "") x.reps = first.reps; });
    saveSessaoRascunho(); render();
  });
  acts.appendChild(bCopy);
  if (ex.series.length > 1) {
    const bRm = el("button", { class: "btn sm" }, "− série");
    bRm.addEventListener("click", () => { ex.series.pop(); saveSessaoRascunho(); render(); });
    acts.appendChild(bRm);
  }
  const bAdd = el("button", { class: "btn sm" }, "+ série");
  bAdd.addEventListener("click", () => {
    const lastS = ex.series[ex.series.length - 1];
    ex.series.push({ peso: lastS ? lastS.peso : "", reps: "", prev: lastS ? lastS.prev : null });
    saveSessaoRascunho(); render();
  });
  acts.appendChild(bAdd);
  body.appendChild(acts);

  // ---- observações (opcional) ----
  const obsBox = el("div", { class: "obs-wrap" });
  const obsId = "obs-" + ex.exercicioId;
  obsBox.innerHTML = `<label for="${esc(obsId)}">Observações <span style="text-transform:none; letter-spacing:0; font-weight:500">(opcional)</span></label>`;
  const ta = el("textarea", { id: obsId, rows: "2", maxlength: "500", placeholder: "Ex.: subi 5 kg, pegada melhor, dor no ombro…", "aria-label": "Observações de " + ex.nome });
  ta.value = typeof ex.obs === "string" ? ex.obs : "";
  ta.addEventListener("input", () => { ex.obs = ta.value; saveSessaoRascunho(); });
  obsBox.appendChild(ta);
  if (obsPrev.length) {
    const det = el("details", { class: "obs-hist" });
    const summ = el("summary", { class: "tiny", style: "cursor:pointer; margin-top:8px" },
      `Observações anteriores (${obsPrev.length})`);
    det.appendChild(summ);
    const inner = el("div");
    for (const o of obsPrev.slice(0, 8)) {
      const line = el("div", { class: "oh" });
      line.innerHTML = `<time>${fmtBR(o.data)}</time><div>${esc(o.obs)}</div>`;
      inner.appendChild(line);
    }
    det.appendChild(inner);
    obsBox.appendChild(det);
  }
  body.appendChild(obsBox);

  c.appendChild(body);
  return c;
}

/* corpo do card de um exercício de cardio: tempo + velocidade (obrigatórios), distância + inclinação (opcionais) */
function renderCardioBody(body, ex, last) {
  if (!Array.isArray(ex.series) || !ex.series.length) ex.series = blankCardioSeries(1, last);
  // normaliza séries antigas/de rascunho que não têm os campos de cardio
  ex.series.forEach(se => {
    if (se.tempo === undefined) se.tempo = "";
    if (se.velocidade === undefined) se.velocidade = "";
    if (se.distancia === undefined) se.distancia = "";
    if (se.inclinacao === undefined) se.inclinacao = "";
  });

  if (last) {
    const l = el("div", { class: "last" });
    l.innerHTML = `Última vez (${fmtBR(last.data)}): <b>${last.series.map(v => fmtCardioSerie(v) || "–").join(" · ")}</b>`;
    body.appendChild(l);
  }

  const faltando = cardioFaltando(ex);
  if (faltando.length) {
    const w = el("div", { class: "load-warn", id: "cardio-warn-" + ex.exercicioId, style: "display:block" });
    w.innerHTML = `⚠ <b>Tempo e velocidade são obrigatórios.</b> Falta preencher na ${faltando.map(f => `${f.i + 1}ª (${f.falta.join(" e ")})`).join(", ")}.`;
    body.appendChild(w);
  }

  // cada série é um bloco 2×2: rótulo em cima do próprio campo (nunca desalinha)
  ex.series.forEach((se, i) => {
    const blk = el("div", { class: "cblock" });
    blk.dataset.serie = String(i + 1);
    const idx = el("div", { class: "cidx" }, `${i + 1}ª`);
    const g = el("div", { class: "cgrid2" });
    const cell = (txt, inp) => {
      const w = el("div", { class: "ccell" });
      const lb = el("span", { class: "lb" }, txt);
      w.appendChild(lb); w.appendChild(inp);
      return w;
    };
    const it = el("input", { type: "number", inputmode: "decimal", step: "0.1", min: "0", placeholder: se.prevTempo != null ? fmtTempoMin(se.prevTempo) : "min", value: se.tempo, "aria-label": `Tempo série ${i + 1} (min)` });
    it.dataset.k = "tempo";
    const iv = el("input", { type: "number", inputmode: "decimal", step: "0.1", min: "0", placeholder: se.prevVel != null ? fmtVel(se.prevVel) : "km/h", value: se.velocidade, "aria-label": `Velocidade série ${i + 1} (km/h)` });
    iv.dataset.k = "velocidade";
    const id = el("input", { type: "number", inputmode: "decimal", step: "0.01", min: "0", placeholder: "opcional", value: se.distancia, "aria-label": `Distância série ${i + 1} (km, opcional)` });
    id.dataset.k = "distancia";
    const ic = el("input", { type: "number", inputmode: "decimal", step: "0.5", min: "0", placeholder: "opcional", value: se.inclinacao, "aria-label": `Inclinação série ${i + 1} (%, opcional)` });
    ic.dataset.k = "inclinacao";
    const sync = () => {
      it.classList.toggle("req-empty", it.value.trim() !== "" && parseTempoMin(it.value) == null);
      iv.classList.toggle("req-empty", iv.value.trim() !== "" && num(iv.value) == null);
    };
    const reval = () => {
      const ainda = cardioFaltando(ex);
      const wEl = $("#cardio-warn-" + ex.exercicioId);
      if (!ainda.length) { if (wEl) wEl.remove(); return; }
      if (wEl) {
        wEl.innerHTML = `⚠ <b>Tempo e velocidade são obrigatórios.</b> Falta preencher na ${ainda.map(f => `${f.i + 1}ª (${f.falta.join(" e ")})`).join(", ")}.`;
      }
    };
    it.addEventListener("input", () => { se.tempo = it.value; sync(); saveSessaoRascunho(); reval(); });
    iv.addEventListener("input", () => { se.velocidade = iv.value; sync(); saveSessaoRascunho(); reval(); });
    id.addEventListener("input", () => { se.distancia = id.value; saveSessaoRascunho(); });
    ic.addEventListener("input", () => { se.inclinacao = ic.value; saveSessaoRascunho(); });
    g.appendChild(cell(`Tempo <span class="reqdot">*</span>`, it));
    g.appendChild(cell(`Velocidade <span class="reqdot">*</span>`, iv));
    g.appendChild(cell(`Distância <i>(opcional)</i>`, id));
    g.appendChild(cell(`Inclinação <i>(opcional)</i>`, ic));
    blk.appendChild(idx); blk.appendChild(g);
    body.appendChild(blk);
  });

  // ações
  const acts = el("div", { class: "row", style: "margin-top:10px; flex-wrap:wrap" });
  const bCopy = el("button", { class: "btn sm" }, "Copiar 1ª para todas");
  bCopy.addEventListener("click", () => {
    const f = ex.series[0];
    if (parseTempoMin(f.tempo) == null || num(f.velocidade) == null) return toast("Preencha tempo e velocidade da 1ª série");
    ex.series.forEach(x => {
      x.tempo = f.tempo; x.velocidade = f.velocidade;
      if (f.distancia !== "") x.distancia = f.distancia;
      if (f.inclinacao !== "") x.inclinacao = f.inclinacao;
    });
    saveSessaoRascunho(); render();
  });
  acts.appendChild(bCopy);
  if (ex.series.length > 1) {
    const bRm = el("button", { class: "btn sm" }, "− série");
    bRm.addEventListener("click", () => { ex.series.pop(); saveSessaoRascunho(); render(); });
    acts.appendChild(bRm);
  }
  const bAdd = el("button", { class: "btn sm" }, "+ série");
  bAdd.addEventListener("click", () => {
    const l = ex.series[ex.series.length - 1] || {};
    ex.series.push({ tempo: l.tempo ?? "", velocidade: l.velocidade ?? "", distancia: "", inclinacao: "",
      prevTempo: l.prevTempo ?? null, prevVel: l.prevVel ?? null });
    saveSessaoRascunho(); render();
  });
  acts.appendChild(bAdd);
  body.appendChild(acts);

  // observações (mesmo componente dos outros tipos)
  const obsBox = el("div", { class: "obs-wrap" });
  const obsId = "obs-" + ex.exercicioId;
  obsBox.innerHTML = `<label for="${esc(obsId)}">Observações <span style="text-transform:none; letter-spacing:0; font-weight:500">(opcional)</span></label>`;
  const ta = el("textarea", { id: obsId, rows: "2", maxlength: "500", placeholder: "Ex.: inclinei 5%, cadência boa, cansaço…", "aria-label": "Observações de " + ex.nome });
  ta.value = typeof ex.obs === "string" ? ex.obs : "";
  ta.addEventListener("input", () => { ex.obs = ta.value; saveSessaoRascunho(); });
  obsBox.appendChild(ta);
  body.appendChild(obsBox);
}

/* rascunho da sessão corrente — sobrevive a reload */
const LS_DRAFT = "academia.draft.v1";
function saveSessaoRascunho() {
  try { localStorage.setItem(LS_DRAFT, JSON.stringify(state.sessao)); } catch (e) {}
}
function clearRascunho() { try { localStorage.removeItem(LS_DRAFT); } catch (e) {} }
function loadRascunho() {
  try {
    const raw = localStorage.getItem(LS_DRAFT);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (d && d.treinoId && Array.isArray(d.exercicios) && d.exercicios.length) return d;
  } catch (e) {}
  return null;
}

function toggleConcluido(ex) {
  // cardio: tempo e velocidade são obrigatórios em todas as séries
  if (!ex.concluido && ex.tipo === "cardio") {
    const falt = cardioFaltando(ex);
    if (falt.length) {
      state.openEx[ex.exercicioId] = true;
      render();
      const w = $("#cardio-warn-" + CSS.escape(ex.exercicioId));
      if (w) w.scrollIntoView({ block: "center", behavior: "smooth" });
      toast(falt.length === 1
        ? `Falta ${falt[0].falta.join(" e ")} na ${falt[0].i + 1}ª série`
        : `Faltam tempo e velocidade em ${falt.length} séries`);
      return;
    }
  }
  ex.concluido = !ex.concluido;
  saveSessaoRascunho();
  render();
  const s = state.sessao;
  if (s) {
    const n = totalEx(s), d = doneEx(s);
    if (ex.concluido) toast(`${d} de ${n} concluídos${d === n ? " — pode finalizar! 🎉" : ""}`);
  }
}

/** Finaliza: exige início + todos os exercícios marcados (ou confirmação explícita). */
function finalizarTreino() {
  const s = state.sessao;
  if (!s) return;

  if (!s.horaInicio) { toast("Toque em “Iniciar treino” primeiro"); return; }

  const faltando = s.exercicios.filter(ex => !ex.concluido);
  if (faltando.length) {
    const nomes = faltando.map(ex => "• " + ex.nome).join("\n");
    const total = s.exercicios.length;
    const aviso = `Atenção: ${faltando.length} de ${total} exercício(s) ainda não foram marcados como concluídos:\n\n${nomes}\n\n` +
      `Finalizar o treino mesmo assim?\n(Os exercícios não marcados NÃO entram no histórico como feitos.)`;
    if (!confirm(aviso)) {
      toast(`${faltando.length} exercício(s) faltando marcar`);
      return;
    }
  }
  concluirSessao(s, faltando.length > 0);
}

function concluirSessao(s, forcar) {
  if (!s) return;
  const exercicios = s.exercicios.map(ex => ({
    exercicioId: ex.exercicioId,
    nome: ex.nome,
    concluido: !!ex.concluido,
    obs: typeof ex.obs === "string" ? ex.obs.trim() : "",
    ...(ex.tipo === "cardio" ? { tipo: "cardio" } : {}),
    series: ex.tipo === "cardio"
      ? ex.series
        .filter(se => parseTempoMin(se.tempo) != null || num(se.velocidade) != null || num(se.distancia) != null || num(se.inclinacao) != null)
        .map(se => {
          const o = { tempo: parseTempoMin(se.tempo), velocidade: num(se.velocidade) };
          const dt = num(se.distancia), ic = num(se.inclinacao);
          if (dt != null) o.distancia = dt;            // opcionais: só grava quando preenchidos
          if (ic != null) o.inclinacao = ic;
          return o;
        })
      : ex.series
        .filter(se => se.peso !== "" || se.reps !== "")
        .map(se => ({ peso: num(se.peso), reps: se.reps === "" ? null : num(se.reps) })),
  })).filter(ex => ex.series.length || ex.concluido);

  if (!exercicios.length) { toast(forcar ? "Nada para salvar" : "Registre o peso de pelo menos um exercício"); return; }

  // grava horários e duração
  if (!s.horaFim) s.horaFim = new Date().toISOString();
  const seg = Math.max(0, Math.round((new Date(s.horaFim) - new Date(s.horaInicio)) / 1000));
  s.duracaoMin = Math.round((seg / 60) * 10) / 10;  // em minutos, 1 casa decimal (ex.: 52.4); nunca 0

  // substitui sessão do mesmo treino no mesmo dia (evita duplicar ao corrigir)
  const pid = perfilAtivoId();
  const idx = state.data.sessoes.findIndex(x => doPerfilAtivo(x) && x.data === s.data && x.treinoId === s.treinoId);
  const reg = {
    perfilId: pid,
    data: s.data, treinoId: s.treinoId,
    horaInicio: s.horaInicio, horaFim: s.horaFim, duracaoMin: s.duracaoMin,
    exercicios,
  };
  if (idx >= 0) state.data.sessoes[idx] = reg;
  else state.data.sessoes.push(reg);
  state.data.sessoes.sort((a, b) => a.data.localeCompare(b.data));

  stopTick();
  saveLocal();
  state.sessao = null;
  clearRascunho();
  state.tab = "historico";
  const canSync = hasToken();
  scheduleSync();
  if (!canSync) setSync("local", "local");
  render();
  const feitos = exercicios.filter(x => x.concluido).length;
  toast(`Treino salvo! ${fmtDuracao(seg)} · ${feitos}/${exercicios.length} exercícios 💪`);
}


/* ============================================================
   Corpo — perfil, medições e composição corporal
   ATENÇÃO: tudo aqui é ESTIMATIVA por fórmula antropométrica.
   Os gráficos NUNCA misturam métodos: Faulkner, Navy, InBody e
   balança divergem até ~18 pontos de gordura na mesma pessoa.
   ============================================================ */
const CORPO_METODOS = ["faulkner", "navy", "inbody", "balanca"];
const CORPO_METODO_LBL = {
  faulkner: "Faulkner", navy: "Navy", inbody: "InBody/DEXA", balanca: "Balança", nenhum: "Sem método",
};
/* cor de cada método nos gráficos — SEMPRE separado por método */
const CORPO_METODO_COR = { faulkner: "#4ade80", navy: "#fbbf24", inbody: "#60a5fa", balanca: "#c4b5fd", nenhum: "#8b98ab" };
let CORPO_ACAO = null;
const CORPO_FONTES = {
  academia: { lbl: "Academia", metodo: "faulkner" },
  medica: { lbl: "Médica/InBody", metodo: "inbody" },
  balanca_casa: { lbl: "Balança", metodo: "balanca" },
  outra: { lbl: "Outra", metodo: "none" },
};
const CORPO_FONTE_LBL = {
  academia: "Academia", medica: "Médica/InBody", balanca_casa: "Balança", outra: "Outra",
  /* aliases de dados antigos/manuais */
  "Médica/InBody": "Médica/InBody", "Balança de casa": "Balança de casa", "Balança": "Balança de casa",
};
const AVISO_MEDICO = "\u26a0\ufe0f O Gusto \u00e9 uma ferramenta de acompanhamento, n\u00e3o um programa m\u00e9dico. Os \u00edndices (IMC, gordura corporal, RCE, RCQ) s\u00e3o ESTIMATIVAS calculadas por f\u00f3rmulas antropom\u00e9tricas e n\u00e3o substituem avalia\u00e7\u00e3o profissional. Consulte m\u00e9dico ou nutricionista antes de tomar decis\u00f5es sobre peso, dieta ou treino.";

/* ---------- perfil (aba Corpo) — SEMPRE o perfil ativo ---------- */
function perfil() {
  let p = perfilAtivo();
  if (!p) {
    // primeiro uso: cria o perfil do dono do aparelho
    p = novoPerfilObj({ nome: "Perfil 1" });
    state.data.perfis = [p];
    state.data.perfilAtivoId = p.id;
  }
  if (p.meta === undefined || p.meta === null || typeof p.meta !== "object") p.meta = {};
  if (!p.metodoPadrao) p.metodoPadrao = "faulkner";
  return p;
}
/** sexo e altura são indispensáveis para IMC/RCE/Navy */
function perfilCompleto() {
  const p = perfil();
  return !!(p.sexo && num(p.alturaCm) && num(p.alturaCm) > 50 && num(p.alturaCm) < 260);
}

/* ---------- cálculos ---------- */
/** IMC = peso / altura(m)^2 + classificação OMS */
function calcIMC(peso, alturaCm) {
  const p = num(peso), h = num(alturaCm);
  if (p == null || h == null || p <= 0 || h <= 0) return null;
  const imc = p / Math.pow(h / 100, 2);
  let cls, tone;
  if (imc < 18.5) { cls = "baixo peso"; tone = "a"; }
  else if (imc < 25) { cls = "normal"; tone = "g"; }
  else if (imc < 30) { cls = "sobrepeso"; tone = "a"; }
  else if (imc < 35) { cls = "obesidade I"; tone = "r"; }
  else if (imc < 40) { cls = "obesidade II"; tone = "r"; }
  else { cls = "obesidade III"; tone = "r"; }
  return { valor: imc, cls, tone };
}
/** RCE = cintura / altura — meta < 0,50 */
function calcRCE(cintura, alturaCm) {
  const c = num(cintura), h = num(alturaCm);
  if (c == null || h == null || c <= 0 || h <= 0) return null;
  const v = c / h;
  let cls, tone;
  if (v < 0.50) { cls = "meta atingida"; tone = "g"; }
  else if (v < 0.60) { cls = "atenção"; tone = "a"; }
  else { cls = "risco elevado"; tone = "r"; }
  return { valor: v, cls, tone };
}
/** RCQ = cintura / quadril — risco > 0,90 (H) e > 0,85 (M) */
function calcRCQ(cintura, quadril, sexo) {
  const c = num(cintura), q = num(quadril);
  if (c == null || q == null || c <= 0 || q <= 0) return null;
  const v = c / q;
  const lim = sexo === "F" ? 0.85 : 0.90;
  return { valor: v, lim, risco: v > lim, cls: v > lim ? "acima do limite" : "dentro do limite", tone: v > lim ? "r" : "g" };
}
/** % gordura pela fórmula da Marinha (medidas em cm; converte para polegadas) */
function calcNavy(m, sexo, alturaCm) {
  if (!m || !sexo) return null;
  const cint = num(m.cintura), pes = num(m.pescoco), alt = num(alturaCm), quad = num(m.quadril);
  if (cint == null || pes == null || !(alt > 0)) return null;
  const IN = 2.54;
  const altIn = alt / IN;
  let pct;
  if (sexo === "M") {
    if (!(cint - pes > 0)) return null;
    pct = 86.010 * Math.log10((cint - pes) / IN) - 70.041 * Math.log10(altIn) + 36.76;
  } else {
    if (quad == null || !(cint + quad - pes > 0)) return null;
    pct = 163.205 * Math.log10((cint + quad - pes) / IN) - 97.684 * Math.log10(altIn) - 78.387;
  }
  if (!isFinite(pct)) return null;
  return { valor: pct };
}
/** % gordura pela fórmula de Faulkner (4 dobras: SE + TR + SI + AB), todas em mm */
function calcFaulkner(dobras) {
  if (!dobras) return null;
  const d = dobras, v = [d.subescapular, d.tricipital, d.suprailiaca, d.abdominal].map(num);
  if (v.some(x => x == null)) return null;
  return { valor: v.reduce((a, b) => a + b, 0) * 0.153 + 5.783 };
}

/* ---------- série de % gordura POR MÉTODO (nunca misturada) ---------- */
/**
 * Pontos de % gordura de um método, um por data (a medição mais recente da data).
 * gs: "gordura" | "gorduraFaulkner" | "gorduraBalanca". Método sem valor fica fora da série.
 */
/**
 * Campo de % de gordura de UM método, na ordem de prioridade (evita misturar réguas):
 * InBody/balança usam o valor próprio e, se faltar, o profissional.gorduraPct.
 */
const CORPO_GORDURA_CAMPOS = {
  inbody: ["gorduraInbody", "gordura"],
  balanca: ["gorduraBalanca", "gordura"],
  faulkner: ["gorduraFaulkner", "gordura"],
  navy: ["gorduraNavy", "gordura"],
};
/** % de gordura de uma medição NO SEU método (null quando não há valor) */
function gorduraDaMedicao(m) {
  if (!m || !m.metodo || m.metodo === "nenhum") return null;
  const campos = CORPO_GORDURA_CAMPOS[m.metodo] || ["gordura"];
  for (const c of campos) {
    const v = num(m[c]);
    if (v != null) return v;
  }
  // última rede de segurança: valor da avaliação profissional (InBody/balança/DEXA)
  return num(m.profissional && m.profissional.gorduraPct);
}
function gorduraSerie(metodo) {
  const porDia = new Map();
  for (const m of medicoesOrdenadas()) {
    if (m.metodo !== metodo) continue;
    const v = gorduraDaMedicao(m);
    if (v == null) continue;
    porDia.set(m.data, { data: m.data, v: v, fonte: m.fonte });
  }
  return [...porDia.values()].sort((a, b) => a.data.localeCompare(b.data));
}
/** quais métodos têm dados de gordura (e por qual campo) */
function metodosComGordura() {
  const out = [];
  for (const metodo of CORPO_METODOS) {
    const pts = gorduraPointsMetodo(metodo);
    if (pts.length) out.push({ metodo, pts });
  }
  return out;
}
/**
 * Pontos de % gordura de UM método (ver gorduraDaMedicao). Toda medição do método
 * que tenha o valor entra na série — inclusive a da balança vinda da avaliação.
 */
function gorduraPointsMetodo(metodo) {
  return gorduraSerie(metodo);
}
function fmtPct(v, casas = 1) { return v == null || !isFinite(v) ? "–" : (Math.round(v * Math.pow(10, casas)) / Math.pow(10, casas)).toFixed(casas).replace(".", ",") + " %"; }
function fmtN(v, casas = 1) { return v == null || !isFinite(v) ? "–" : (Number((Math.round(v * Math.pow(10, casas)) / Math.pow(10, casas)).toFixed(casas))).toFixed(casas).replace(".", ","); }
function fmtDelta(v, casas = 1, unidade = "") {
  if (v == null || !isFinite(v)) return "–";
  const r = Math.round(v * Math.pow(10, casas)) / Math.pow(10, casas);
  if (r === 0) return "= 0" + (unidade ? " " + unidade : "");
  return (r > 0 ? "+" : "−") + fmtN(Math.abs(r), casas) + (unidade ? " " + unidade : "");
}
/** medições em ordem cronológica (com data válida) */
function medicoesOrdenadas() {
  const arr = medicoesDoPerfil();
  // ordena por data; mesma data → a registrada por último fica como a mais recente
  return arr.filter(m => m && m.data)
    .map((m, i) => ({ m, i }))
    .sort((a, b) => String(a.m.data).localeCompare(String(b.m.data)) || a.i - b.i)
    .map(x => x.m);
}
/** cor de cada método nos gráficos */
function corMetodo(metodo) { return CORPO_METODO_COR[metodo] || CORPO_METODO_COR.nenhum; }

/* ============================================================
   Gráficos da aba Corpo
   ============================================================ */
/**
 * Gráfico de linha simples (peso, cintura).
 * points: [{data, v}] · ref: {v, tol} para a faixa verde (RCE) · cor: cor da linha
 */
function svgCorpoSimples(points, { w = 420, h = 200, casas = 1, ref = null, cor = "#4ade80", id = "" } = {}) {
  const ns = "http://www.w3.org/2000/svg";
  const padL = 44, padR = 14, padT = 16, padB = 30;
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("class", "chart");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("role", "img");
  if (id) svg.dataset.chart = id;
  const mk = (tag, attrs, txt) => {
    const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (txt !== undefined) n.textContent = txt;
    svg.appendChild(n);
    return n;
  };
  if (!points.length) {
    mk("text", { x: w / 2, y: h / 2, fill: "#8b98ab", "font-size": 13, "text-anchor": "middle" }, "Sem dados");
    return svg;
  }
  const vals = points.map(p => p.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (ref) { min = Math.min(min, ref.v - (ref.tol || 0) * 2); max = Math.max(max, ref.v + (ref.tol || 0) * 2); }
  if (min === max) { min -= 1; max += 1; }
  else { const pad = (max - min) * 0.18; min -= pad; max += pad; }
  if (min < 0) min = 0;
  const iw = w - padL - padR, ih = h - padT - padB;
  const x = (i) => padL + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const y = (v) => padT + ih - ((v - min) / (max - min)) * ih;
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * (i / 4);
    const yy = y(v);
    mk("line", { x1: padL, x2: w - padR, y1: yy, y2: yy, stroke: "#2a3240", "stroke-width": 1 });
    mk("text", { x: padL - 8, y: yy + 4, fill: "#8b98ab", "font-size": 11, "text-anchor": "end" }, fmtN(v, casas));
  }
  // faixa de referência (ex.: RCE < 0,50)
  if (ref) {
    const yTop = y(Math.min(max, ref.v + (ref.tol || 0))), yBot = y(Math.max(min, ref.v - (ref.tol || 0)));
    mk("rect", { x: padL, y: Math.min(yTop, yBot), width: iw, height: Math.max(1, Math.abs(yBot - yTop)), fill: ref.cor || "rgba(74,222,128,.12)" });
    const yl = y(ref.v);
    if (yl >= padT && yl <= padT + ih) {
      mk("line", { x1: padL, x2: w - padR, y1: yl, y2: yl, stroke: ref.corLinha || "#4ade80", "stroke-width": 1, "stroke-dasharray": "4 4", opacity: .8 });
    }
  }
  if (points.length > 1) {
    const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    mk("path", { d, fill: "none", stroke: cor, "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" });
  }
  points.forEach((p, i) => {
    mk("circle", { cx: x(i), cy: y(p.v), r: 4.5, fill: "#121214", stroke: cor, "stroke-width": 2.5 });
    mk("title", {}, `${fmtBR(p.data)}: ${fmtN(p.v, casas)}`);
  });
  const stepX = Math.max(1, Math.ceil(points.length / 5));
  points.forEach((p, i) => {
    if (i % stepX !== 0 && i !== points.length - 1) return;
    mk("text", { x: x(i), y: h - 8, fill: "#8b98ab", "font-size": 11, "text-anchor": "middle" }, fmtBRshort(p.data));
  });
  return svg;
}

/**
 * Gráfico de DUAS séries com eixo duplo (peso kg à esquerda, IMC à direita).
 * g1/g2: [{data, v}] — mesma base de datas; escalas independentes; 1 ponto fica centralizado.
 */
function svgCorpoDuplo(g1, g2, { w = 440, h = 220, c1 = "#4ade80", c2 = "#fbbf24", id = "peso-cintura", lb1 = "kg", lb2 = "cm" } = {}) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("class", "chart");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Evolução do peso (kg, eixo esquerdo) e do IMC (eixo direito)");
  svg.dataset.chart = id;
  const mk = (tag, attrs, txt, parent) => {
    const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) n.setAttribute(k, v);
    if (txt !== undefined) n.textContent = txt;
    (parent || svg).appendChild(n);
    return n;
  };
  if (!g1.length) {
    mk("text", { x: w / 2, y: h / 2, fill: "#8b98ab", "font-size": 13, "text-anchor": "middle" }, "Sem dados");
    return svg;
  }
  const padL = 44, padR = 46, padT = 20, padB = 30;
  const iw = w - padL - padR, ih = h - padT - padB;
  const esc = (vals) => {
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (lo === hi) { lo -= 1; hi += 1; } else { const pad = (hi - lo) * 0.18; lo -= pad; hi += pad; }
    return { lo, hi };
  };
  const e1 = esc(g1.map(p => p.v));
  const e2 = g2.length ? esc(g2.map(p => p.v)) : null;
  // eixo X: datas únicas de todas as medições, ordenadas
  const datas = [...new Set(g1.concat(g2).map(p => p.data))].sort();
  const xi = (data) => {
    const i = datas.indexOf(data);
    return padL + (datas.length === 1 ? iw / 2 : (i / (datas.length - 1)) * iw);
  };
  const y1 = (v) => padT + ih - ((v - e1.lo) / (e1.hi - e1.lo)) * ih;
  const y2 = (v) => padT + ih - ((v - e2.lo) / (e2.hi - e2.lo)) * ih;
  // grade + rótulos dos dois eixos (4 faixas)
  for (let i = 0; i <= 4; i++) {
    const yy = padT + ih - (i / 4) * ih;
    mk("line", { x1: padL, x2: w - padR, y1: yy, y2: yy, stroke: "#2a3240", "stroke-width": 1 });
    const v1 = e1.lo + (e1.hi - e1.lo) * (i / 4);
    mk("text", { x: padL - 8, y: yy + 4, fill: c1, "font-size": 11, "text-anchor": "end", "data-axis": "kg" }, fmtN(v1, 1));
    if (e2) {
      const v2 = e2.lo + (e2.hi - e2.lo) * (i / 4);
      mk("text", { x: w - padR + 8, y: yy + 4, fill: c2, "font-size": 11, "text-anchor": "start", "data-axis": "cintura" }, fmtN(v2, 1));
    }
  }
  // rótulos dos eixos
  mk("text", { x: padL - 8, y: padT - 7, fill: c1, "font-size": 10.5, "font-weight": 700, "text-anchor": "end", "data-axis-label": lb1 }, lb1);
  if (e2) mk("text", { x: w - padR + 8, y: padT - 7, fill: c2, "font-size": 10.5, "font-weight": 700, "text-anchor": "start", "data-axis-label": lb2 }, lb2);

  const desenha = (pts, yf, cor, dash, serie) => {
    const g = document.createElementNS(ns, "g");
    g.dataset.serie = serie;
    g.dataset.pontos = String(pts.length);
    svg.appendChild(g);
    if (pts.length > 1) {
      const d = pts.map((p, i) => `${i ? "L" : "M"}${xi(p.data).toFixed(1)},${yf(p.v).toFixed(1)}`).join(" ");
      mk("path", { d, fill: "none", stroke: cor, "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-dasharray": dash || undefined }, undefined, g);
    }
    pts.forEach(p => {
      mk("circle", { cx: xi(p.data).toFixed(1), cy: yf(p.v).toFixed(1), r: 4.5, fill: "#121214", stroke: cor, "stroke-width": 2.5, "data-v": p.v.toFixed(2), "data-data": p.data }, undefined, g);
      mk("title", {}, `${fmtBR(p.data)}: ${serie === "peso" ? fmtN(p.v, 1) + " kg" : "IMC " + fmtN(p.v, 2)}`, g);
    });
  };
  desenha(g1, y1, c1, null, "peso");
  if (g2.length) desenha(g2, y2, c2, "5 4", "imc");

  const stepX = Math.max(1, Math.ceil(datas.length / 5));
  datas.forEach((dt, i) => {
    if (i % stepX !== 0 && i !== datas.length - 1) return;
    mk("text", { x: xi(dt), y: h - 8, fill: "#8b98ab", "font-size": 11, "text-anchor": "middle" }, fmtBRshort(dt));
  });
  return svg;
}

/**
 * Gráfico de % gordura com UMA LINHA POR MÉTODO.
 * series: [{metodo, pts:[{data,v}]}] — cada método tem sua cor, seu traçado e seus pontos;
 * nenhuma linha liga pontos de métodos diferentes.
 */
function svgCorpoGordura(series, { w = 420, h = 220 } = {}) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("class", "chart");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("role", "img");
  svg.dataset.chart = "gordura";
  const mk = (tag, attrs, txt) => {
    const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (txt !== undefined) n.textContent = txt;
    svg.appendChild(n);
    return n;
  };
  const all = [];
  const datas = [];
  series.forEach(s => s.pts.forEach(p => { all.push(p.v); if (!datas.includes(p.data)) datas.push(p.data); }));
  if (!all.length) {
    mk("text", { x: w / 2, y: h / 2, fill: "#8b98ab", "font-size": 13, "text-anchor": "middle" }, "Sem dados de gordura");
    return svg;
  }
  // eixo X = apenas as datas dos pontos exibidos (evita eixo cheio de datas sem dado)
  datas.sort();
  const padL = 40, padR = 14, padT = 18, padB = 30;
  const iw = w - padL - padR, ih = h - padT - padB;
  let min = Math.min(...all), max = Math.max(...all);
  if (min === max) { min -= 2; max += 2; } else { const pad = (max - min) * 0.2; min -= pad; max += pad; }
  if (min < 0) min = 0;
  const xi = (i) => padL + (datas.length === 1 ? iw / 2 : (i / (datas.length - 1)) * iw);
  const y = (v) => padT + ih - ((v - min) / (max - min)) * ih;
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * (i / 4);
    const yy = y(v);
    mk("line", { x1: padL, x2: w - padR, y1: yy, y2: yy, stroke: "#2a3240", "stroke-width": 1 });
    mk("text", { x: padL - 8, y: yy + 4, fill: "#8b98ab", "font-size": 11, "text-anchor": "end" }, fmtN(v, 1));
  }
  // uma linha por método — dados nunca compartilham caminho com outro método
  for (const s of series) {
    const pts = s.pts.slice().sort((a, b) => a.data.localeCompare(b.data));
    if (!pts.length) continue;
    const g = document.createElementNS(ns, "g");
    g.dataset.metodo = s.metodo;
    g.dataset.chart = "gordura";
    g.dataset.line = s.pts.length > 1 ? "1" : "0";
    const cor = corMetodo(s.metodo);
    if (pts.length > 1) {
      const d = pts.map((p, i) => `${i ? "L" : "M"}${xi(datas.indexOf(p.data)).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", d);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", cor);
      path.setAttribute("stroke-width", "2.5");
      path.setAttribute("stroke-linejoin", "round");
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-dasharray", s.metodo === "navy" ? "7 4" : s.metodo === "balanca" ? "2 4" : "0");
      path.dataset.metodo = s.metodo;
      path.dataset.role = "linha-gordura-" + s.metodo;
      g.appendChild(path);
    }
    for (const p of pts) {
      const c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", xi(datas.indexOf(p.data))); c.setAttribute("cy", y(p.v)); c.setAttribute("r", 4.5);
      c.setAttribute("fill", "#121214"); c.setAttribute("stroke", cor); c.setAttribute("stroke-width", 2.5);
      c.dataset.metodo = s.metodo;
      const tt = document.createElementNS(ns, "title");
      tt.textContent = `${CORPO_METODO_LBL[s.metodo]} · ${fmtBR(p.data)}: ${fmtPct(p.v)}`;
      c.appendChild(tt);
      g.appendChild(c);
    }
    svg.appendChild(g);
  }
  const stepX = Math.max(1, Math.ceil(datas.length / 5));
  datas.forEach((d, i) => {
    if (datas.length > 5 && i % stepX !== 0) return;
    mk("text", { x: xi(i), y: h - 8, fill: "#8b98ab", "font-size": 11, "text-anchor": "middle" }, fmtBRshort(d));
  });
  return svg;
}

/* ---------- excluir perfil: apaga fichas, sessões e medições DELE ---------- */
function confirmarExclusaoPerfil(p) {
  const total = perfisArr().length;
  if (total <= 1) return toast("Não é possível excluir o último perfil");
  const fim = (arr) => (Array.isArray(arr) ? arr.filter(x => x && x.perfilId === p.id) : []);
  const nF = fim(state.data.treinos).length, nS = fim(state.data.sessoes).length, nM = fim(state.data.medicoes).length;
  const msg = `Excluir o perfil “${nomePerfil(p)}”?\n\n` +
    `Apaga permanentemente:\n• ${nF} ficha(s) de treino\n• ${nS} treino(s) no histórico\n• ${nM} medição(ões)\n\n` +
    `Os outros perfis não são afetados. Esta ação não pode ser desfeita.`;
  if (!confirm(msg)) return;
  // comparação EXPLÍCITA (nunca por negação: `undefined !== id` apagaria itens sem dono)
  state.data.perfis = perfisArr().filter(x => x.id !== p.id);
  state.data.treinos = state.data.treinos.filter(x => x.perfilId !== p.id);
  state.data.sessoes = state.data.sessoes.filter(x => x.perfilId !== p.id);
  state.data.medicoes = state.data.medicoes.filter(x => x.perfilId !== p.id);
  if (state.data.perfilAtivoId === p.id) state.data.perfilAtivoId = state.data.perfis[0] ? state.data.perfis[0].id : null;
  if (state.sessao) { stopTick(); state.sessao = null; clearRascunho(); }
  CORPO_ACAO = null; MEDICAO_EDIT = null; state.corpoForm = false;
  saveLocal(); scheduleSync(); hideOverlay(); render();
  toast("Perfil excluído");
}

/* ---------- recalcular método/gordura de uma medição ---------- */
function recalcularMedicao(m) {
  const p = perfil();
  if (!m.metodo) m.metodo = m.fonte === "medica" ? "inbody" : m.fonte === "academia" ? "faulkner" : m.fonte === "balanca_casa" ? "balanca" : "nenhum";
  if (m.metodo === "faulkner") {
    const f = calcFaulkner(m.dobras);
    m.gorduraFaulkner = f ? Math.round(f.valor * 10) / 10 : null;
    // % principal da linha Faulkner (separada das demais no gráfico)
    m.gordura = f ? m.gorduraFaulkner : (num(m.gordura) == null ? null : m.gordura);
  } else if (m.metodo === "navy") {
    const n = calcNavy(m, p.sexo, p.alturaCm);
    m.gorduraNavy = n ? Math.round(n.valor * 10) / 10 : null;
    if (n) m.gordura = m.gorduraNavy;
  } else if (m.metodo === "balanca") {
    if (m.gorduraBalanca == null) m.gorduraBalanca = num(m.gordura);
    if (m.gorduraBalanca == null) m.gorduraBalanca = num(m.profissional && m.profissional.gorduraPct);
    if (m.gordura == null) m.gordura = m.gorduraBalanca;
  }
  if (m.gordura != null) m.gordura = Math.round(num(m.gordura) * 10) / 10;
  return m;
}

/* -------------------- dados da balança: parser tolerante -------------------- */
/**
 * Lê os números que a balança mostra, colados num campo de texto só, e reconhece
 * POR RÓTULO (nunca por posição). Aceita vírgula ou ponto decimal, com ou sem unidade,
 * separadores "·", ";", ",", "|", quebra de linha ou dois espaços. Rótulos
 * desconhecidos (IMC, data, hora, idade…) são ignorados — o IMC o app calcula.
 */
const BALANCA_SEP_ANTES = /[·•;|\n\r\t]+|\s[;,]\s|[,;](?=\s*[A-Za-zÀ-ÿ%])|\s{2,}/;
/** rótulos reconhecidos, ancorados no início do token */
const BALANCA_LABEL = {
  massaMagraKg: /^(?:massa\s*magra|livre\s*de\s*gordura|fat\s*free)/,
  mmeKg: /^(?:\bmme\b|\bmm\b|massa\s*muscular|muscular|musculo|m[uú]sculo)/,
  visceral: /^visceral/,
  tmb: /^(?:\btmb\b|metabol|basal|\bget\b|taxa\s*metabolica)/,
  aguaKg: /^(?:peso\s*da\s*agua|\bagua\b|hidrat|water)/,
  gorduraPct: /^(?:gordura|%\s*g\b|\bgc\b|\bpg\b|\bgord\b|\bfat\b)/,
};
/** um novo rótulo no meio de um token (ex.: "Peso 80 MME 40 Gordura 20%"); "gordura visceral" não conta */
const BALANCA_OUTRO_ROTULO = "massa\\s*magra|livre\\s*de\\s*gordura|\\bmme\\b|massa\\s*muscular(?:\\s*esqueletica)?|musculo|visceral|\\btmb\\b|taxa\\s*metabolica|metabol\\w*|basal|peso\\s*da\\s*agua|\\bagua\\b|hidrat\\w*|gordura(?!\\s*visceral)|%\\s*g\\b|\\bgc\\b|\\bpg\\b";
// corta antes de um novo rótulo: com espaço ("40 kg Gordura") ou colado na unidade ("80kg MME")
const BALANCA_CORTE = new RegExp("(?:(?<=\\d{1,2}(?:[.,]\\d{1,2})?\\s*(?:kg|%|kcal|cm|\\.))|\\s+)(?=" + BALANCA_OUTRO_ROTULO + ")", "gi");
/** "resíduo" que não é dado numérico útil (peso, IMC, data, hora, marca do aparelho) */
const BALANCA_RUIDO = /^(?:peso(?:\s*(?:kg|atual))?|imc|data|hora|idade|altura|%|marca|modelo)\b/;
const BALANCA_UNID = /(kcal\/dia|kcal|kg|%|cm)/i;
function balancaNorm(t) {
  return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}
function balancaCampo(label) {
  if (/^massa\b/.test(label)) return /muscul|m[uú]sculo/.test(label) ? "mmeKg" : (BALANCA_LABEL.massaMagraKg.test(label) ? "massaMagraKg" : null);
  return ["mmeKg", "visceral", "tmb", "aguaKg", "gorduraPct", "massaMagraKg"].find(k => BALANCA_LABEL[k].test(label)) || null;
}
/** aplica valor/unidade de um rótulo; devolve true se virou campo */
function balancaAplicar(out, campo, valor, unidade, peso) {
  const v = num(String(valor).replace(".", ","));
  if (v == null || !isFinite(v)) return false;
  const u = String(unidade || "").toLowerCase();
  if (campo === "gorduraPct") {
    if (u === "kg") return false;                    // "gordura" em kg não é %
    if (!(v > 0 && v < 75)) return false;
    out.gorduraPct = Math.round(v * 10) / 10;
  } else if (campo === "aguaKg") {
    if (u === "%" || (u !== "kg" && v > 100)) {      // água em % do peso → kg

function parseDadosBalanca(txt, pesoKg) {

  const peso = num(pesoKg);
  const partes = bruto.split(BALANCA_SEP_ANTES).flatMap(p => p.split(BALANCA_CORTE));
  let pend = null;   // rótulo sem número no mesmo token ("Gordura" e "31,5%" em linhas diferentes)
  for (const parte of partes) {
    const t = String(parte).trim().replace(/^[:=.\s]+|[:=]+$/g, "");
    if (!t || t === "-" || t === "–") continue;
    const label = balancaNorm(t);
    const nums = t.match(/\d{1,4}(?:[.,]\d{1,2})?/g) || [];
    const unid = ((t.match(BALANCA_UNID) || [])[1] || "").toLowerCase();
    const campo = balancaCampo(label);
    if (!nums.length) {
      if (campo) pend = campo; else naoReconhecido.push(t);
      continue;
    }
    if (!campo) {
      // número sem rótulo: só "%" solto é aceito como gordura — nunca por posição
      const soPct = nums.length === 1 && unid === "%" && !/[a-z]/i.test(t.replace(/%/g, ""));

        pend = null;
      } else if (!BALANCA_RUIDO.test(label)) naoReconhecido.push(t);   // peso, IMC, data… (o app calcula)
      continue;
    }
    pend = null;
    let ok = false;
    for (const n of nums) if (balancaAplicar(out, campo, n, unid, peso)) { ok = true; break; }
    if (!ok) naoReconhecido.push(t);
  }
  if (out.aguaKg != null && peso) out.aguaPct = Math.round(out.aguaKg / peso * 1000) / 10;

    const fail = (msg, alvo) => {
      err.style.display = ""; err.innerHTML = `\u26a0 <b>${esc(msg)}</b>`;
      $c("#md-peso").classList.toggle("req-empty", alvo === "peso");
      err.scrollIntoView({ block: "center", behavior: "smooth" });
    };
    if (o.peso == null || o.peso <= 0) return fail("Informe o peso (kg) \u2014 obrigat\u00f3rio", "peso");
    if (o.peso < 20 || o.peso > 400) return fail("Peso fora da faixa esperada (20 a 400 kg)", "peso");
    if (!o.data) return fail("Informe a data");
    if (!$c("#md-fonte").value) return fail("Escolha a fonte");
    if (o.metodo === "faulkner" && o.gorduraFaulkner == null) toast("Faulkner sem as 4 dobras \u2014 gordura n\u00e3o calculada");
    if (o.metodo === "navy" && o.gorduraNavy == null) toast("Navy com dados insuficientes \u2014 gordura n\u00e3o calculada");
    if ((o.metodo === "balanca" || o.metodo === "inbody") && o.gordura == null) toast("Sem % de gordura \u2014 salvo peso e medidas");
    err.style.display = "none";
    salvarMedicao(o);
  });
}

function salvarMedicao(o) {
  if (!Array.isArray(state.data.medicoes)) state.data.medicoes = [];
  o.perfilId = o.perfilId || perfilAtivoId();   // cada medição pertence ao perfil ativo
  if (MEDICAO_EDIT) {
    const i = state.data.medicoes.findIndex(m => m.id === MEDICAO_EDIT.id);
    if (i >= 0) state.data.medicoes[i] = o; else state.data.medicoes.push(o);
  } else {
    state.data.medicoes.push(o);
  }
  state.data.medicoes.sort((a, b) => String(a.data).localeCompare(String(b.data)));
  MEDICAO_EDIT = null;
  state.corpoForm = false;
  saveLocal();
  scheduleSync();
  render();
  toast(MEDICAO_EDIT ? "Medi\u00e7\u00e3o salva" : "Medi\u00e7\u00e3o salva \u2713");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function nomeFonte(f) {
  return CORPO_FONTE_LBL[f] || CORPO_FONTE_LBL[CORPO_FONTES[f] && CORPO_FONTES[f].lbl] || (f ? String(f) : "Outra");
}

/** números derivados de uma medição (todos podem ser null) */
function numerosMedicao(m) {
  const p = perfil();
  const alt = num(p.alturaCm);
  const imc = calcIMC(m.peso, alt);
  const rce = calcRCE(m.cintura, alt);
  const rcq = calcRCQ(m.cintura, m.quadril, p.sexo);
  const metodo = m.metodo;
  const gordura = gorduraDaMedicao(m);
  let massaMagra = null, massaGorda = null;
  if (gordura != null && num(m.peso) != null) {
    massaMagra = num(m.peso) * (1 - gordura / 100);
    massaGorda = num(m.peso) * (gordura / 100);
  }
  // massa magra de avaliação profissional tem prioridade (fonte mais confiável)
  const profMagra = m.profissional && num(m.profissional.massaMagraKg);
  if (profMagra != null) massaMagra = profMagra;
  // sem % de gordura NESTE método: massa magra/gorda fica nula (não mistura métodos)
  if (gordura == null) { massaMagra = profMagra != null ? profMagra : null; massaGorda = null; }
  return { imc, rce, rcq, gordura, massaMagra, massaGorda, metodo };
}

/** comparação com a medição anterior; % gordura só é comparado dentro do MESMO método */
function cardComparacao(ult, ant) {
  const c = el("div", { class: "card", id: "corpo-comparacao" });
  if (!ant) {
    c.innerHTML = `<h3 style="font-size:16px">Desde a anterior</h3>
      <p class="tiny" style="margin:6px 0 0">Primeira medi\u00e7\u00e3o registrada \u2014 a partir da pr\u00f3xima voc\u00ea v\u00ea a varia\u00e7\u00e3o.</p>`;
    return c;
  }
  const a = numerosMedicao(ult), b = numerosMedicao(ant);
  const casas = (k) => (k.indexOf("IMC") >= 0 || k.indexOf("RCE") >= 0 || k.indexOf("RCQ") >= 0) ? 2 : 1;
  const antesDepois = {
    "Peso (kg)": [ant.peso, ult.peso, "kg"], "Cintura (cm)": [ant.cintura, ult.cintura, "cm"],
    "IMC": [b.imc && b.imc.valor, a.imc && a.imc.valor, ""], "RCE": [b.rce && b.rce.valor, a.rce && a.rce.valor, ""],
    "RCQ": [b.rcq && b.rcq.valor, a.rcq && a.rcq.valor, ""],
  };
  const linha = (k, v, ok) => {
    const pa = antesDepois[k] || [];
    const de = pa[0] == null ? "" : `<span class="tiny" style="margin-left:6px">(${fmtN(pa[0], casas(k))} \u2192 ${fmtN(pa[1], casas(k))})</span>`;
    return `<div class="vl"><span class="vk">${k}${de}</span>
    <span class="vv" style="color:${v == null ? "var(--mut)" : ok ? "var(--acc)" : "var(--err)"}">${v == null ? "\u2013" : fmtDelta(v, casas(k), k === "IMC" ? "" : k.indexOf("(kg)") >= 0 ? "kg" : k.indexOf("(cm)") >= 0 ? "cm" : "")}</span></div>`;
  };
  const dPeso = ult.peso != null && ant.peso != null ? ult.peso - ant.peso : null;
  const dCint = ult.cintura != null && ant.cintura != null ? ult.cintura - ant.cintura : null;
  const movLbl = (dCint == null && dPeso == null) ? "" : (() => {
    const pesoCaiu = dPeso != null && dPeso < 0, cintDim = dCint != null && dCint < 0, cintSub = dCint != null && dCint > 0;
    if (pesoCaiu && cintDim) return { cls: "", txt: "peso e cintura caíram" };
    if (pesoCaiu && cintSub) return { cls: "load-warn", txt: "peso caiu com cintura maior" };
    if (pesoCaiu) return { cls: "", txt: "peso caiu" };
    if (cintDim) return { cls: "", txt: "cintura diminuiu" };
    if (dPeso != null && dPeso > 0) return { cls: "flat", txt: "peso subiu" };
    return null;
  })();
  c.innerHTML = `<div class="row"><h3 style="font-size:16px">Desde a anterior</h3><span class="sp"></span>
      <span class="tiny">${fmtBR(ant.data)} \u2192 ${fmtBR(ult.data)}</span></div>
    <div class="var-list" id="cmp-linhas">
      ${linha("Peso (kg)", dPeso, dPeso != null && dPeso <= 0)}
      ${linha("Cintura (cm)", dCint, dCint != null && dCint <= 0)}
      ${a.imc && b.imc ? linha("IMC", a.imc.valor - b.imc.valor, a.imc.valor <= b.imc.valor) : ""}
      ${a.rce && b.rce ? linha("RCE", a.rce.valor - b.rce.valor, a.rce.valor <= b.rce.valor) : ""}
      ${a.rcq && b.rcq ? linha("RCQ", a.rcq.valor - b.rcq.valor, a.rcq.valor <= b.rcq.valor) : ""}
    </div>
    <div id="cmp-gordura"></div>
    ${movLbl ? (movLbl.cls ? `<div class="load-warn" style="margin-top:8px">⚠ <b>${movLbl.txt}</b>. Acompanhe a circunferência abdominal — o peso sozinho não conta a história.</div>`
      : `<div class="tiny" style="margin-top:8px; color:#93c5fd">↘ ${movLbl.txt}.</div>`) : ""}
    <div class="tiny" style="margin-top:6px">A % de gordura s\u00f3 \u00e9 comparada entre medi\u00e7\u00f5es do <b>mesmo m\u00e9todo</b>.</div>`;
  const gbox = $("#cmp-gordura", c);
  // cada método só é comparado com o anterior DO MESMO método
  let html = "";
  for (const serie of metodosComGordura()) {
    const pts = serie.pts;
    if (pts.length < 2) continue;
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    const d = last.v - prev.v;
    html += `<div class="vl" data-cmp-gordura="${serie.metodo}" style="font-size:13.5px; display:flex; gap:8px; padding:7px 0; border-bottom:1px solid rgba(42,50,64,.6)">
      <span class="vk"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${corMetodo(serie.metodo)};margin-right:6px;vertical-align:-1px"></i>Gordura ${esc(CORPO_METODO_LBL[serie.metodo])}</span>
      <span class="vv" style="color:${d <= 0 ? "var(--acc)" : "var(--err)"}">${fmtDelta(d, 1, "pp")}</span></div>`;
  }
  const semPar = metodosComGordura().filter(s => s.pts.length < 2).map(s => CORPO_METODO_LBL[s.metodo]);
  gbox.innerHTML = html + (semPar.length ? `<div class="tiny" style="margin-top:6px">Sem medição anterior para comparar: ${esc(semPar.join(", "))}.</div>` : "");
  return c;
}

function cardGorduraMetodos() {

  [escolhido].forEach(s => {

    const box = el("div", { class: "kbox", style: `border-color:${corMetodo(s.metodo)}55` });
    box.dataset.metodo = s.metodo;
    box.dataset.gordura = String(Math.round(last.v * 10) / 10);
    box.dataset.n = String(pts.length);
    const sub = d == null
      ? (pts.length === 1 ? "1 medicao - " + fmtBRshort(last.data) : pts.length + " medicoes")

    box.innerHTML = `<div class="kl" style="color:${corMetodo(s.metodo)}">${esc(CORPO_METODO_LBL[s.metodo])}</div>

}

/* ============================================================
   Gráficos — SVG puro
   ============================================================ */
function svgChart(points, { w = 420, h = 220, metric = "max", yLabel = null, minPad = null } = {}) {
  const padL = yLabel ? 52 : 40, padR = 14, padT = 16, padB = 30;
  const iw = w - padL - padR, ih = h - padT - padB;
  const vals = points.map(p => p[metric]);
  let min = Math.min(...vals), max = Math.max(...vals);
  const zoom = minPad || 2.5;
  if (min === max) { min -= zoom; max += zoom; }
  else { const pad = (max - min) * 0.15; min -= pad; max += pad; }
  if (min < 0) min = 0;
  const x = (i) => padL + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const y = (v) => padT + ih - ((v - min) / (max - min)) * ih;

  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("class", "chart");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("role", "img");
  const mk = (tag, attrs, txt) => {
    const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (txt !== undefined) n.textContent = txt;
    svg.appendChild(n);
    return n;
  };
  // linhas de grade
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = min + (max - min) * (i / steps);
    const yy = y(v);
    mk("line", { x1: padL, x2: w - padR, y1: yy, y2: yy, stroke: "#2a3240", "stroke-width": 1 });
    mk("text", { x: padL - 8, y: yy + 4, fill: "#8b98ab", "font-size": 11, "text-anchor": "end" }, yLabel ? fmtVel(v) : Math.round(v * 10) / 10);
  }
  // área + linha
  if (points.length > 1) {
    const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[metric]).toFixed(1)}`).join(" ");
    mk("path", { d: `${d} L${x(points.length - 1)},${padT + ih} L${x(0)},${padT + ih} Z`, fill: "rgba(251,191,36,.13)" });
    mk("path", { d, fill: "none", stroke: "#4ade80", "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" });
  }
  // pontos
  points.forEach((p, i) => {
    mk("circle", { cx: x(i), cy: y(p[metric]), r: 4.5, fill: "#121214", stroke: "#fbbf24", "stroke-width": 2.5 });
    mk("title", {}, `${fmtBR(p.data)}: ${p.max} kg (média ${p.avg.toFixed(1)})`);
  });
  // rótulos eixo x (máx ~5)
  const stepX = Math.max(1, Math.ceil(points.length / 5));
  points.forEach((p, i) => {
    if (i % stepX !== 0 && i !== points.length - 1) return;
    mk("text", { x: x(i), y: h - 8, fill: "#8b98ab", "font-size": 11, "text-anchor": "middle" }, fmtBRshort(p.data));
  });
  if (!points.length) mk("text", { x: w / 2, y: h / 2, fill: "#8b98ab", "font-size": 13, "text-anchor": "middle" }, "Sem dados");
  if (yLabel) mk("text", { x: 4, y: padT - 3, fill: "#8b98ab", "font-size": 10, "text-anchor": "start" }, yLabel);
  return svg;
}

/**
 * Gráfico de cardio no MESMO estilo do gráfico de carga (grade, área verde, linha verde, pontos amarelos).
 * metric: "vel" (km/h, área verde) ou "dist" (km, linha azul, área azul).
 */
function svgCardioChart(points, { w = 420, h = 210, metric = "vel" } = {}) {
  const isVel = metric === "vel";
  const pts = points.filter(p => p[metric] != null);
  const padL = 40, padR = 14, padT = 18, padB = 30;
  const iw = w - padL - padR, ih = h - padT - padB;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("class", "chart");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("role", "img");
  svg.dataset.metric = metric;
  const mk = (tag, attrs, txt) => {
    const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (txt !== undefined) n.textContent = txt;
    svg.appendChild(n);
    return n;
  };
  const all = points.map(p => p[metric]).filter(v => v != null);
  if (!all.length) {
    mk("text", { x: w / 2, y: h / 2, fill: "#8b98ab", "font-size": 13, "text-anchor": "middle" }, "Sem dados de " + (isVel ? "velocidade" : "distância"));
    return svg;
  }
  let min = Math.min(...all), max = Math.max(...all);
  const zoom = isVel ? 0.5 : 0.2;
  if (min === max) { min -= zoom * 2; max += zoom * 2; }
  else { const pad = (max - min) * 0.18; min -= pad; max += pad; }
  if (min < 0) min = 0;
  const x = (i) => padL + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const y = (v) => padT + ih - ((v - min) / (max - min)) * ih;
  // grade
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * (i / 4);
    const yy = y(v);
    mk("line", { x1: padL, x2: w - padR, y1: yy, y2: yy, stroke: "#2a3240", "stroke-width": 1 });
    mk("text", { x: padL - 8, y: yy + 4, fill: "#8b98ab", "font-size": 11, "text-anchor": "end" },
      isVel ? fmtVel(v) : (Math.round(v * 10) / 10).toFixed(1).replace(".", ","));
  }
  // linha (ignora lacunas: distância vazia não quebra o traçado)
  let d = "", first = true;
  points.forEach((p, i) => {
    if (p[metric] == null) return;
    d += `${first ? "M" : "L"}${x(i).toFixed(1)},${y(p[metric]).toFixed(1)} `;
    first = false;
  });
  const withIdx = points.map((p, i) => ({ ...p, i })).filter(p => p[metric] != null);
  if (withIdx.length > 1) {
    mk("path", {
      d: `${d}L${x(withIdx[withIdx.length - 1].i).toFixed(1)},${padT + ih} L${x(withIdx[0].i).toFixed(1)},${padT + ih} Z`,
      fill: isVel ? "rgba(74,222,128,.12)" : "rgba(96,165,250,.12)",
    });
  }
  if (withIdx.length > 1) {
    mk("path", { d: d.trim(), fill: "none", stroke: isVel ? "#4ade80" : "#60a5fa", "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" });
  }
  // pontos
  withIdx.forEach(p => {
    mk("circle", { cx: x(p.i), cy: y(p[metric]), r: 4.5, fill: "#121214", stroke: "#fbbf24", "stroke-width": 2.5 });
    mk("title", {}, `${fmtBR(p.data)}: ${isVel ? fmtVel(p.vel) + " km/h" : fmtKm(p.dist) + " km"}${p.tempo != null ? " (" + fmtTempoMin(p.tempo) + ")" : ""}`);
  });
  // eixo x
  const stepX = Math.max(1, Math.ceil(points.length / 5));
  points.forEach((p, i) => {
    if (i % stepX !== 0 && i !== points.length - 1) return;
    mk("text", { x: x(i), y: h - 8, fill: "#8b98ab", "font-size": 11, "text-anchor": "middle" }, fmtBRshort(p.data));
  });
  return svg;
}

function exerciseList() {
  const out = [];
  const seen = new Set();
  for (const t of treinosDoPerfil()) for (const ex of t.exercicios) {
    if (seen.has(ex.id)) continue;
    seen.add(ex.id);
    out.push({ ...ex, treinoId: t.id });
  }
  return out;
}

/**

  const sel = cardios.find(c => c.id === selId) || cardios[0];
