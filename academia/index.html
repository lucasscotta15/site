  const card = el("div", { class: "card", id: "cardio-evo", style: "margin-top:14px" });
  card.dataset.exercicio = sel.id;
  card.innerHTML = `<div class="row"><h3 style="font-size:16px">Cardio · ${esc(sel.nome)}</h3><span class="sp"></span>
    <span class="badge cardio">cardio</span></div>`;

  if (cardios.length > 1) {
    const seg = el("div", { class: "seg", style: "margin-top:8px", role: "tablist", "aria-label": "Exercício de cardio" });
    cardios.forEach(c => {
      const b = el("button", { class: "csel" + (c.id === selId ? " on" : ""), "aria-pressed": c.id === selId ? "true" : "false" }, c.nome);
      b.dataset.exid = c.id;
      b.addEventListener("click", () => { state.chartCardio = c.id; render(); });
      seg.appendChild(b);
    });
    card.appendChild(seg);
  }

  if (!pts.length) {
    card.insertAdjacentHTML("beforeend", `<p class="muted" style="font-size:14px">Ainda sem registros de cardio para este exercício. Faça um treino e o gráfico aparece aqui.</p>`);
    return card;
  }

  // --- velocidade ---
  const t1 = el("div", { style: "margin-top:10px" });
  t1.innerHTML = `<div class="tiny" style="font-weight:700; color:var(--txt)">Velocidade (km/h, média da sessão)</div>`;
  t1.appendChild(svgCardioChart(pts, { metric: "vel" }));
  card.appendChild(t1);

  const vels = pts.map(p => p.vel).filter(v => v != null);
  const vFirst = vels[0], vLast = vels[vels.length - 1];
  const dv = vLast - vFirst;
  const kpi = el("div", { class: "ckpi", id: "cardio-kpi-vel" });
  kpi.innerHTML = `<div><b style="color:var(--acc)" data-k="velmax">${fmtVel(Math.max(...vels))}</b><span>máx. km/h</span></div>
    <div><b data-k="velligual" style="color:${dv > 0.05 ? "var(--acc)" : dv < -0.05 ? "var(--err)" : "var(--txt)"}">${dv > 0.05 ? "+" : ""}${fmtVel(dv)}</b><span>desde o início</span></div>
    <div><b data-k="sessoes">${pts.length}</b><span>sessões</span></div>`;
  card.appendChild(kpi);

  // --- distância (opcional: pode haver sessões sem distância) ---
  const dists = pts.filter(p => p.dist != null);
  const t2 = el("div", { style: "margin-top:16px" });
  t2.innerHTML = `<div class="tiny" style="font-weight:700; color:var(--txt)">Distância (km)</div>`;
  if (dists.length) {
    t2.appendChild(svgCardioChart(pts, { metric: "dist" }));
    const dFirst = dists[0].dist, dLast = dists[dists.length - 1].dist;
    const dd = dLast - dFirst;
    const k2 = el("div", { class: "ckpi", id: "cardio-kpi-dist" });
    k2.innerHTML = `<div><b style="color:#60a5fa" data-k="distmax">${fmtKm(Math.max(...dists.map(p => p.dist)))}</b><span>máx. km</span></div>
      <div><b data-k="distdelta" style="color:${dd > 0.005 ? "var(--acc)" : dd < -0.005 ? "var(--err)" : "var(--txt)"}">${dd > 0.005 ? "+" : ""}${fmtKm(dd)}</b><span>desde o início</span></div>
      <div><b data-k="distn">${dists.length}</b><span>com distância</span></div>`;
    t2.appendChild(k2);
  } else {
    t2.insertAdjacentHTML("beforeend", `<p class="tiny" style="margin:6px 0 0">Sem distância registrada — é campo opcional (nem toda esteira/bicicleta mede).</p>`);
  }
  card.appendChild(t2);

  // última sessão registrada
  const ult = pts[pts.length - 1];
  const lu = el("div", { class: "tiny", style: "margin-top:12px", id: "cardio-ultima" });
  lu.innerHTML = `Última (${fmtBR(ult.data)}): <b style="color:var(--txt)">${[ult.tempo != null ? fmtTempoMin(ult.tempo) : null, ult.vel != null ? fmtVel(ult.vel) + " km/h" : null, ult.dist != null ? fmtKm(ult.dist) + " km" : null, ult.inc != null ? fmtVel(ult.inc) + " % incl." : null].filter(Boolean).join(" · ")}</b>`;
  card.appendChild(lu);
  return card;
}

function renderGraficos(v) {
  const exs = exerciseList();
  if (!exs.length) { v.innerHTML = `<div class="card muted">Nenhum exercício na ficha.</div>`; return; }
  const withData = exs.filter(ex => seriesForChart(ex.id).length);
  const selId = state.chartEx.sel || (withData[0] || exs[0]).id;
  const sel = exs.find(e => e.id === selId) || exs[0];

  // resumo do mês por ficha (atual vs anterior)
  const mA = mesAtual();
  const agora = resumoMes(mA);
  const ant = resumoMes(somaMes(mA, -1));
  const fichas = treinosDoPerfil().filter(t => (agora.porFicha[String(t.id).trim().toUpperCase()] || 0) > 0
    || (ant.porFicha[String(t.id).trim().toUpperCase()] || 0) > 0);
  const mes = el("div", { class: "card fichas-mes", id: "ev-mes", style: "margin-top:14px" });
  mes.innerHTML = `<div class="row"><h3 style="font-size:16px">Por ficha</h3><span class="sp"></span>
    <span class="tiny" id="ev-mes-cap" style="text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(agora.nome)} vs ${esc(ant.nome)}</span></div>`;
  if (!fichas.length) {
    mes.insertAdjacentHTML("beforeend", `<p class="tiny" style="margin:8px 0 0">${sessoesDoPerfil().length
      ? `Nenhum treino em ${esc(agora.nome)} nem em ${esc(ant.nome)}.`
      : "Comece seu primeiro treino"}</p>`);
  } else {
    for (const t of fichas) {
      const fid = String(t.id).trim().toUpperCase();
      const r = el("div", { class: "fh" });
      r.dataset.ficha = fid;
      r.innerHTML = `<div class="lt">${esc(t.id)}</div><div class="fx">
        <div class="fn">${esc(t.nome)}</div>
        <div class="fd">${linhaFichaMes(agora, ant, fid)}</div></div>`;
      mes.appendChild(r);
    }
  }
  v.appendChild(mes);

  const cust = el("div", { class: "card", style: "margin-top:14px" });
  cust.innerHTML = `<label class="tiny" style="font-weight:600">Exercício</label>`;
  const selEl = el("select", { id: "sel-ex", style: "margin-top:6px" });
  let groupT = null;
  for (const ex of exs) {
    if (ex.treinoId !== groupT) {
      groupT = ex.treinoId;
      const g = el("optgroup", { label: "Treino " + groupT });
      selEl.appendChild(g);
      for (const e of exs.filter(x => x.treinoId === groupT)) {
        const o = el("option", { value: e.id }, e.nome);
        if (e.id === selId) o.selected = true;
        g.appendChild(o);
      }
    }
  }
  cust.appendChild(selEl);
  selEl.addEventListener("change", () => { state.chartEx.sel = selEl.value; render(); });
  v.appendChild(cust);

  const pts = seriesForChart(sel.id);
  const card = el("div", { class: "card" });
  card.innerHTML = `<div class="row"><h3 style="font-size:16px">${esc(sel.nome)}</h3><span class="sp"></span>
    <span class="tiny">Treino ${esc(sel.treinoId)}</span></div>`;
  if (!pts.length) {
    card.innerHTML += `<p class="muted" style="font-size:14px">Ainda sem registros para este exercício. Faça um treino e o gráfico aparece aqui.</p>`;
  } else {
    const maxW = Math.max(...pts.map(p => p.max));
    const first = pts[0].max, last = pts[pts.length - 1].max;
    const diff = last - first;
    card.appendChild(svgChart(pts, { metric: "max" }));
    const st = el("div", { class: "stat" });
    st.innerHTML = `<div><b>${maxW}</b><span>recorde (kg)</span></div>
      <div><b style="color:${diff > 0 ? "var(--acc)" : diff < 0 ? "var(--err)" : "var(--txt)"}">${diff > 0 ? "+" : ""}${diff}</b><span>desde o início</span></div>
      <div><b>${pts.length}</b><span>sessões</span></div>`;
    card.appendChild(st);
  }
  v.appendChild(card);

  // observações do exercício selecionado (lista cronológica)
  const obsAll = obsHistoryFor(sel.id);
  const oc = el("div", { class: "card" });
  oc.innerHTML = `<h3 style="font-size:15px">Observações · ${esc(sel.nome)}</h3>`;
  if (!obsAll.length) {
    oc.innerHTML += `<p class="tiny" style="margin:6px 0 0">Nenhuma observação registrada para este exercício.</p>`;
  } else {
    const inner = el("div", { class: "obs-hist", style: "margin-top:4px" });
    for (const o of obsAll) {
      const line = el("div", { class: "oh" });
      line.innerHTML = `<time>${fmtBR(o.data)}</time><div>${esc(o.obs)}</div>`;
      inner.appendChild(line);
    }
    oc.appendChild(inner);
  }
  v.appendChild(oc);

  // ---- cardio: evolução de velocidade e distância (agrupado por exercício) ----
  const cardios = exs.filter(ex => ex.tipo === "cardio");
  if (cardios.length) v.appendChild(cardioEvolucaoCard(cardios));

  // todos os exercícios com mini resumo
  const list = el("div", { class: "card" });
  list.innerHTML = `<h3 style="font-size:15px; margin-bottom:6px">Todos os exercícios</h3>`;
  for (const ex of exs) {
    const p = seriesForChart(ex.id);
    const stag = ex.tipo === "cardio" ? null : loadStagnation(ex.id);
    const r = el("div", { class: "row", style: "padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer" });
    if (ex.tipo === "cardio") {
      const cp = cardioForChart(ex.id);
      const ult = cp.length ? cp[cp.length - 1] : null;
      r.innerHTML = `<div style="flex:1; min-width:0"><div style="font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(ex.nome)} <span class="badge cardio">cardio</span></div>
        <div class="tiny">Treino ${esc(ex.treinoId)} · ${cp.length} sessão(ões)</div></div>
        <div style="text-align:right"><b>${ult && ult.vel != null ? fmtVel(ult.vel) + " km/h" : "–"}</b></div>`;
      r.addEventListener("click", () => {
        state.chartCardio = ex.id;
        const n = $("#cardio-evo");
        if (n) n.scrollIntoView({ block: "start", behavior: "smooth" });
        render();
      });
      list.appendChild(r);
      return;
    }
    const lastP = p.length ? p[p.length - 1].max : null;
    const prevP = p.length > 1 ? p[p.length - 2].max : null;
    let arrow = "";
    if (lastP != null && prevP != null) arrow = lastP > prevP ? '<span style="color:var(--acc)">▲</span>' : lastP < prevP ? '<span style="color:var(--err)">▼</span>' : "";
    r.innerHTML = `<div style="flex:1; min-width:0"><div style="font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(ex.nome)}</div>
      <div class="tiny">Treino ${esc(ex.treinoId)} · ${p.length} sessão(ões)</div>
      ${stag ? `<span class="mini-warn">⚠ Considere aumentar a carga · ${stag.dias} dias</span>` : ""}</div>
      <div style="text-align:right"><b>${lastP != null ? lastP + " kg" : "–"}</b> ${arrow}</div>`;
    r.addEventListener("click", () => { state.chartEx.sel = ex.id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    list.appendChild(r);
  }
  v.appendChild(list);
}

/* ============================================================
   Histórico
   ============================================================ */
function renderHistorico(v) {
  stopTick();
  const sess = [...sessoesDoPerfil()].sort((a, b) => (b.data + (b.horaInicio || "")).localeCompare(a.data + (a.horaInicio || "")));
  if (!sess.length) {
    v.innerHTML = `<div class="card muted" style="margin-top:14px" id="hist-vazio">Nenhum treino registrado ainda para <b style="color:var(--txt)">${esc(nomePerfil(perfil()))}</b>. Escolha uma ficha na aba Treino \u2014 cada perfil tem as suas.</div>`;
    if (!state.logged) v.appendChild(loginPromptCard());
    return;
  }
  // resumo semanal
  const wk = stampWeek(todayISO());
  const thisWeek = sess.filter(s => stampWeek(s.data) === wk).length;
  const comDur = sess.filter(s => s.duracaoMin != null && s.duracaoMin > 0);
  const somaMin = comDur.reduce((a, s) => a + s.duracaoMin, 0);
  const mediaMin = comDur.length ? Math.round(somaMin / comDur.length) : null;
  const sum = el("div", { class: "card", style: "margin-top:14px" });
  sum.id = "hist-resumo";
  sum.innerHTML = `<div class="row" style="margin-bottom:8px"><div class="tiny" style="font-weight:700; color:var(--txt)" id="hist-perfil">Histórico · ${esc(nomePerfil(perfil()))}</div></div>
    <div class="row"><div><div class="tiny">Esta semana</div><b style="font-size:24px">${thisWeek}</b><span class="muted"> treino(s)</span></div>
    <span class="sp"></span><div style="text-align:center"><div class="tiny">Total</div><b style="font-size:24px">${sess.length}</b></div>
    <span class="sp"></span><div style="text-align:right"><div class="tiny">${mediaMin != null ? "Média por treino" : "Duração"}</div><b style="font-size:20px">${mediaMin != null ? fmtDuracao(mediaMin * 60) : "–"}</b></div></div>
    ${somaMin ? `<div class="tiny" style="margin-top:8px">Tempo total registrado: <b style="color:var(--txt)">${fmtDuracao(somaMin * 60)}</b></div>` : ""}`;
  v.appendChild(sum);

  let curMonth = null;
  for (const s of sess) {
    const m = s.data.slice(0, 7);
    if (m !== curMonth) {
      curMonth = m;
      const [y, mm] = m.split("-");
      const names = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
      v.appendChild(el("h3", { style: "font-size:13px; color:var(--mut); text-transform:capitalize; margin:16px 2px 2px" }, `${names[+mm - 1]} ${y}`));
    }
    const t = getTreino(s.treinoId);
    const b = el("button", { class: "hist" });
    const totalSets = s.exercicios.reduce((a, e) => a + e.series.length, 0);
    const vol = s.exercicios.reduce((a, e) => a + (e.tipo === "cardio" ? 0 : e.series.reduce((q, x) => q + (x.peso || 0) * (x.reps || 0), 0)), 0);
    // cardio: minutos e km totais da sessão (entram como chip no lugar do volume)
    const cTot = s.exercicios.filter(e => e.tipo === "cardio").reduce((acc, e) => {
      const st = cardioStats(e.series);
      acc.min += st.tempoTotal || 0;
      acc.km += st.distTotal || 0;
      acc.n++;
      return acc;
    }, { min: 0, km: 0, n: 0 });
    const feitos = s.exercicios.filter(x => x.concluido).length;
    const temDur = s.duracaoMin != null && s.duracaoMin > 0;
    const temHora = !!s.horaInicio;
    const nObs = s.exercicios.filter(x => x.obs && x.obs.trim()).length;
    b.innerHTML = `<span class="letter badge" style="font-size:14px; padding:7px 10px; align-self:flex-start">${esc(s.treinoId)}</span>
      <div style="flex:1; min-width:0"><div class="d">${esc(t ? t.nome : "Treino " + s.treinoId)}</div>
      <div class="metarow" style="margin-top:3px">
        <span>${fmtBR(s.data)}</span>
        ${temDur ? `<span class="chip" style="font-size:11px; padding:1px 7px; color:var(--acc); border-color:rgba(74,222,128,.35)">⏱ ${fmtDuracao(s.duracaoMin * 60)}</span>` : ""}
        ${temHora ? `<span>${fmtHora(s.horaInicio)} → ${fmtHora(s.horaFim)}</span>` : ""}
        ${cTot.n ? `<span class="chip" style="font-size:11px; padding:1px 7px; color:#93c5fd; border-color:rgba(96,165,250,.35)" title="Cardio na sessão">🏃 ${fmtTempoMin(cTot.min)}${cTot.km ? " · " + fmtKm(cTot.km) + " km" : ""}</span>` : ""}
        ${nObs ? `<span title="Com observações">📝 ${nObs}</span>` : ""}
      </div>
      <div class="tiny" style="margin-top:2px">${feitos ? `${feitos}/${s.exercicios.length} exercícios feitos` : `${s.exercicios.length} exercícios`}${totalSets ? " · " + totalSets + " séries" : ""}${vol ? " · vol. " + Math.round(vol) + " kg" : ""}</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b98ab" stroke-width="2.5" style="flex:none"><path d="M9 6l6 6-6 6"/></svg>`;
    b.addEventListener("click", () => showSessionDetail(s));
    v.appendChild(b);
  }
}

function showSessionDetail(s) {
  const t = getTreino(s.treinoId);
  let html = `<div class="row"><div><h2 style="font-size:18px">${esc(t ? t.nome : "Treino")}</h2>
    <div class="tiny">Treino ${esc(s.treinoId)} · ${fmtBR(s.data)}</div></div><span class="sp"></span>
    <button class="iconbtn" id="x-close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="stat" style="margin-top:12px">
      <div><b>${s.duracaoMin != null ? fmtDuracao(s.duracaoMin * 60) : "–"}</b><span>duração</span></div>
      <div><b>${fmtHora(s.horaInicio)}</b><span>início</span></div>
      <div><b>${fmtHora(s.horaFim)}</b><span>fim</span></div>
    </div>
    <div class="tiny" style="margin-top:8px">${s.exercicios.filter(x => x.concluido).length || 0} de ${s.exercicios.length} exercícios concluídos</div>
    <div style="margin-top:10px">`;
  for (const ex of s.exercicios) {
    html += `<div style="padding:9px 0; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:flex-start">
      <span style="flex:none; font-weight:800; color:${ex.concluido ? "var(--acc)" : "var(--mut)"}; width:18px">${ex.concluido ? "✓" : "·"}</span>
      <div style="min-width:0; flex:1"><div style="font-weight:650; font-size:14.5px${ex.concluido ? "" : "; opacity:.7"}">${esc(ex.nome)}</div>
      <div class="tiny">${ex.series.length
        ? (ex.tipo === "cardio"
            ? ex.series.map((v, i) => `${i + 1}ª ${fmtCardioSerie(v)}`).join(" · ")
            : ex.series.map((v, i) => `${i + 1}ª ${v.peso ?? "–"}kg${v.reps ? "×" + v.reps : ""}`).join(" · "))
        : "sem séries registradas"}</div>
      ${ex.obs && ex.obs.trim() ? `<div class="obs-line">📝 ${esc(ex.obs.trim())}</div>` : ""}</div></div>`;
  }
  html += `</div>
    <button class="btn block" id="x-repeat">Repetir este treino com esses pesos</button>
    <button class="btn block danger" id="x-del">Excluir esta sessão</button>`;
  openSheet(html);
  $("#x-close").addEventListener("click", hideOverlay);
  $("#x-repeat").addEventListener("click", () => {
    hideOverlay();
    const tr = getTreino(s.treinoId);
    if (!tr) return toast("Ficha não existe mais");
    state.sessao = {
      data: todayISO(), treinoId: s.treinoId,
      horaInicio: null, horaFim: null, duracaoMin: null,
      exercicios: tr.exercicios.map(ex => {
        const prev = s.exercicios.find(x => x.exercicioId === ex.id);
        const def = blankSeries(ex.series, ex.tipo);
        if (prev && ex.tipo !== "cardio") prev.series.forEach((v, i) => { if (def[i]) { def[i].peso = v.peso ?? ""; def[i].prev = v.peso; } });
        return { exercicioId: ex.id, nome: ex.nome, tipo: ex.tipo, repsAlvo: ex.reps, concluido: false, obs: "", series: def, lastData: s.data };
      }),
    };
    state.openEx = {};
    state.tab = "inicio";
    saveSessaoRascunho();
    render();
  });
  $("#x-del").addEventListener("click", () => {
    if (!confirm("Excluir o treino de " + fmtBR(s.data) + "? Não pode ser desfeito.")) return;
    const i = state.data.sessoes.findIndex(x => x === s);
    if (i >= 0) state.data.sessoes.splice(i, 1);
    saveLocal(); scheduleSync(); hideOverlay(); render(); toast("Sessão excluída");
  });
}

/* ============================================================
   Fichas (editar treinos)

    c.innerHTML = `<div class="row"><span class="letter badge" style="font-size:14px; padding:7px 10px">${esc(t.id)}</span>
      <div style="flex:1"><div style="font-weight:700">${esc(t.nome)}</div><div class="tiny">${t.exercicios.length} exercícios</div></div>
      <button class="btn sm" id="ed-${esc(t.id)}">Editar</button></div>`;
    v.appendChild(c);
    $(`#ed-${CSS.escape(t.id)}`, c).addEventListener("click", () => { state.editTreinoId = t.id; render(); });
  }

  const btns = el("div");
  const bAdd = el("button", { class: "btn block" }, "+ Adicionar ficha");
  bAdd.addEventListener("click", addTreino);
  btns.appendChild(bAdd);
  v.appendChild(btns);

  const acct = el("div", { class: "card", style: "margin-top:16px" });
  acct.innerHTML = `<h3 style="font-size:15px; margin-bottom:8px">Conta</h3>`;
  if (state.logged) {
    const bSync = el("button", { class: "btn block sm", style: "margin-top:0" }, "Sincronizar agora");
    bSync.addEventListener("click", async () => { if (!fileId) fileId = await findFile().catch(() => null); doSync(); toast("Sincronizando…"); });
    acct.appendChild(bSync);
    const bOut = el("button", { class: "btn block sm danger" }, "Sair / trocar conta");
    bOut.addEventListener("click", signOut);
    acct.appendChild(bOut);
  } else {
    const bIn = el("button", { class: "btn block sm pri", style: "margin-top:0" }, "Entrar com Google");
    bIn.addEventListener("click", showLoginSheet);
    acct.appendChild(bIn);
  }
  const bExp = el("button", { class: "btn block sm" }, "Exportar backup (JSON)");
  bExp.addEventListener("click", exportBackup);
  acct.appendChild(bExp);
  const bImp = el("button", { class: "btn block sm" }, "Importar backup (JSON)");
  bImp.addEventListener("click", importBackup);
  acct.appendChild(bImp);
  v.appendChild(acct);
  v.appendChild(el("p", { class: "tiny center", style: "margin:14px 0 20px" }, "Gusto v1.3 · dados no seu Drive"));
}

function renderEditor(v) {
  const t = getTreino(state.editTreinoId);
  if (!t) { state.editTreinoId = null; return renderFichas(v); }
  const head = el("div", { class: "card", style: "margin-top:14px" });
  head.innerHTML = `<button class="btn sm" id="back">← Voltar</button>
    <div class="field"><label>Letra / código</label><input type="text" id="t-id" value="${esc(t.id)}" maxlength="3" style="text-transform:uppercase"></div>
    <div class="field"><label>Nome da ficha</label><input type="text" id="t-nome" value="${esc(t.nome)}"></div>`;
  v.appendChild(head);
  $("#back", head).addEventListener("click", () => { state.editTreinoId = null; render(); });
  $("#t-nome", head).addEventListener("input", (e) => { t.nome = e.target.value; saveLocal(); scheduleSync(); });
  $("#t-id", head).addEventListener("input", (e) => { t.id = e.target.value.toUpperCase().slice(0, 3) || t.id; saveLocal(); scheduleSync(); });

  const list = el("div", { class: "card" });
  list.innerHTML = `<h3 style="font-size:15px">Exercícios</h3>
    <div class="tiny" style="margin-bottom:4px">Toque no nome para editar. Use ↑ para reordenar.</div>`;
  t.exercicios.forEach((ex, i) => {
    const r = el("div", { class: "editrow" });
    r.dataset.exid = ex.id;
    const name = el("input", { type: "text", class: "name", value: ex.nome, "aria-label": "Nome do exercício" });
    name.addEventListener("input", () => { ex.nome = name.value; saveLocal(); scheduleSync(); });
    const sets = el("input", { type: "number", min: "1", max: "20", value: ex.series, "aria-label": "Séries" });
    sets.addEventListener("change", () => { ex.series = Math.max(1, Math.min(20, parseInt(sets.value, 10) || 3)); sets.value = ex.series; saveLocal(); scheduleSync(); });
    const reps = el("input", { type: "text", style: "width:80px", value: ex.reps, "aria-label": "Meta de repetições ou tempo" });
    reps.addEventListener("input", () => { ex.reps = reps.value; saveLocal(); scheduleSync(); });
    // seletor de tipo: Repetições | Tempo | Cardio
    const isC = ex.tipo === "cardio";
    const tseg = el("div", { class: "tipo-seg", style: "grid-column:1 / -1; margin-bottom:2px", role: "group", "aria-label": "Tipo do exercício" });
    [["reps", "Repetições"], ["tempo", "Tempo"], ["cardio", "Cardio"]].forEach(([v, lb]) => {
      const b = el("button", { type: "button", class: "tipo-btn" + (v === "cardio" ? " blue" : "") + ((ex.tipo || "reps") === v ? " on" : ""), "aria-pressed": (ex.tipo || "reps") === v ? "true" : "false" }, lb);
      b.dataset.tipo = v;
      b.addEventListener("click", () => { ex.tipo = v; saveLocal(); scheduleSync(); render(); });
      tseg.appendChild(b);
    });
    const hint = el("div", { class: "tiny", style: "grid-column:1 / -1; margin:-2px 0 2px; line-height:1.35" },
      isC ? "Cardio (esteira/bicicleta): registra <b>tempo</b> e <b>velocidade</b> (obrigatórios); distância e inclinação são opcionais."
          : "Peso por série; a meta é livre (ex.: 8 a 12).");
    const del = el("button", { class: "iconbtn", "aria-label": "Remover" },
      `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>`);
    del.addEventListener("click", () => {
      if (!confirm("Remover “" + ex.nome + "” da ficha?\n(Os registros antigos continuam no histórico.)")) return;
      t.exercicios.splice(i, 1); saveLocal(); scheduleSync(); render();
    });
    // mover
    const up = el("button", { class: "iconbtn", "aria-label": "Subir" },
      `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b98ab" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg>`);
    up.addEventListener("click", () => { if (i === 0) return; [t.exercicios[i - 1], t.exercicios[i]] = [t.exercicios[i], t.exercicios[i - 1]]; saveLocal(); scheduleSync(); render(); });
    const wrapSets = el("label");
    wrapSets.innerHTML = `<span class="fieldhint">Séries</span>`;
    wrapSets.appendChild(sets);
    const wrapReps = el("label");
    wrapReps.innerHTML = `<span class="fieldhint">${isC ? "Meta (opcional)" : "Reps"}</span>`;
    wrapReps.appendChild(reps);
    if (isC) reps.placeholder = "ex.: 20 min";
    const wrapBtns = el("div", { class: "row", style: "gap:6px" });
    wrapBtns.append(up, del);
    r.append(name, tseg, hint, wrapSets, wrapReps, wrapBtns);
    list.appendChild(r);
  });
  const add = el("button", { class: "btn block", style: "margin-top:12px" }, "+ Adicionar exercício");
  add.addEventListener("click", () => { askNovoExercicio(t, "reps"); });
  const addC = el("button", { class: "btn block", style: "margin-top:8px" }, "+ Adicionar cardio (esteira / bicicleta)");
  addC.addEventListener("click", () => { askNovoExercicio(t, "cardio"); });
  list.appendChild(add);
  list.appendChild(addC);
  v.appendChild(list);

  if (treinosDoPerfil().length > 1) {
    const bd = el("button", { class: "btn block danger" }, "Excluir ficha");
    bd.addEventListener("click", () => {
      if (!confirm("Excluir a ficha “" + t.nome + "”?")) return;
      state.data.treinos = state.data.treinos.filter(x => x !== t);
      state.editTreinoId = null; saveLocal(); scheduleSync(); render();
    });
    v.appendChild(bd);
  }
}

/** cria um exercício na ficha; tipo 'cardio' já vem com meta de tempo em branco */
function askNovoExercicio(t, tipo) {
  const isC = tipo === "cardio";
  openSheet(`
    <h2>${isC ? "Adicionar cardio" : "Adicionar exercício"}</h2>
    <p class="tiny" style="margin:2px 0 12px">${isC ? "Esteira, bicicleta, elíptico… Tempo e velocidade serão pedidos no treino." : "Exercício de musculação, com séries e repetições."}</p>
    <label >Nome
      <input class="inp" id="ne-nome" type="text" placeholder="${isC ? "ex.: Esteira" : "ex.: Supino reto"}" autocomplete="off">
    </label>
    <div class="row" style="gap:8px; margin-top:14px">
      <button class="btn" id="ne-cancel">Cancelar</button>
      <button class="btn pri" id="ne-ok" style="flex:1">Adicionar</button>
    </div>`);
  const inp = $("#ne-nome");
  const submit = () => {
    const nome = inp.value.trim();
    if (!nome) { inp.focus(); return toast("Digite o nome do exercício"); }
    const ex = { id: uid("x"), nome: nome, series: isC ? 1 : 3, reps: isC ? "" : "8 a 12", tipo: tipo || "reps" };
    while (idsExistentesDoPerfil(t).has(ex.id)) ex.id = uid("x");
    t.exercicios.push(ex);
    hideOverlay(); saveLocal(); scheduleSync(); render();
    toast(isC ? "Cardio adicionado — tempo e velocidade no treino" : "Exercício adicionado");
  };
  $("#ne-ok").addEventListener("click", submit);
  $("#ne-cancel").addEventListener("click", hideOverlay);
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  setTimeout(() => inp.focus(), 30);
}

function addTreino() {
  const letraSug = String.fromCharCode(65 + treinosDoPerfil().length);
  openSheet(`
    <h2>Nova ficha</h2>
    <p class="tiny" style="margin:2px 0 12px">Escolha um código curto e um nome para a ficha.</p>
    <label >Código
      <input class="inp" id="nf-letra" type="text" maxlength="3" value="${esc(letraSug)}" autocomplete="off" style="text-transform:uppercase">
    </label>
    <label  style="margin-top:10px">Nome da ficha
      <input class="inp" id="nf-nome" type="text" placeholder="ex.: Full body" autocomplete="off">
    </label>
    <div class="row" style="gap:8px; margin-top:14px">
      <button class="btn" id="nf-cancel">Cancelar</button>
      <button class="btn pri" id="nf-ok" style="flex:1">Criar ficha</button>
    </div>`);
  const il = $("#nf-letra"), inn = $("#nf-nome");
  const submit = () => {
    const letra = il.value.trim().toUpperCase();
    const nome = inn.value.trim();
    if (!letra) { il.focus(); return toast("Informe o código da ficha"); }
    if (!nome) { inn.focus(); return toast("Informe o nome da ficha"); }
    if (treinosDoPerfil().some(t => t.id === letra)) return toast("Já existe uma ficha com esse código");
    const t = { id: letra.slice(0, 3), nome: nome, exercicios: [], perfilId: perfilAtivoId() };
    state.data.treinos.push(t);
    state.editTreinoId = t.id;
    hideOverlay(); saveLocal(); scheduleSync(); render();
    toast("Ficha " + t.id + " criada");
  };
  $("#nf-ok").addEventListener("click", submit);
  $("#nf-cancel").addEventListener("click", hideOverlay);
  inn.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  setTimeout(() => inn.focus(), 30);
}

/* ============================================================
   Backup
   ============================================================ */
function exportBackup() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "academia-dados.json" });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importBackup() {
  const inp = el("input", { type: "file", accept: "application/json,.json", class: "hidden" });
  document.body.appendChild(inp);
  inp.addEventListener("change", async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const d = normalizeData(JSON.parse(await f.text()));
      if (!confirm(`Importar ${d.sessoes.length} sessão(ões) e ${d.treinos.length} ficha(s)? Os dados atuais serão substituídos.`)) return;
      state.data = d; saveLocal(); scheduleSync(); render(); toast("Backup importado");
    } catch (e) { toast("Arquivo inválido"); }
    inp.remove();
  });
  inp.click();
}

/* ============================================================
   Navegação
   ============================================================ */
document.querySelectorAll("#tabs button").forEach(b => {
  b.addEventListener("click", () => {
    if (state.sessao && state.tab === "inicio") { /* mantém sessão mas troca de aba */ }
    state.tab = b.dataset.tab;
    state.editTreinoId = null;
    if (b.dataset.tab !== "corpo") { CORPO_ACAO = null; MEDICAO_EDIT = null; state.corpoForm = false; }
    window.scrollTo({ top: 0 });
    render();
  });
});

window.addEventListener("online", () => {
  toast("Online — sincronizando");
  if (state.dirty && hasToken()) scheduleSync(200);
  else setSync(hasToken() ? "saved" : "local");
});
window.addEventListener("offline", () => setSync("offline"));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.dirty && hasToken() && navigator.onLine) scheduleSync(300);
});

/* service worker */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW:", e)));
}

/* ============================================================
   Boot
   ============================================================ */
(function boot() {
  state.data = normalizeData(loadLocal() || defaultData());
  if (!loadLocal()) saveLocal();
  let savedMode = false;
  try { savedMode = localStorage.getItem(LS_MODE) === "1"; } catch (e) {}
  if (savedMode) state.mode = "app";
  const tk = loadToken();
  if (tk) {
    state.token = tk; state.logged = true;
    setSync("saved", "salvo");
    if (state.dirty) scheduleSync(400);
  } else {
    state.logged = false;
    setSync("local", "local");
  }
  // sessão em andamento
  const dr = loadRascunho();
  if (dr) { state.sessao = dr; }
  // dados de demonstração só em modo dev (query ?demo=1)
  // migra o formato antigo (perfil único, itens sem dono) e já grava: nada volta a ficar ambíguo
  migrarItensSemPerfil();
  saveLocal();
  if (new URLSearchParams(location.search).has("demo") && !state.data.sessoes.length) {
    seedDemo();
  }
  render();
  if (state.logged) {
    // valida token em background
    findFile().then(id => { fileId = id; }).catch(e => {
      if (e.message === "AUTH") { clearToken(); setSync("local", "local"); render(); }
    });
  }
})();

/* Dados de exemplo — usados em testes (?demo=1) e no primeiro uso vazio apenas para preview */
function seedDemo() {
  const mk = (treinoId, datas) => {
    const t = getTreino(treinoId);
    datas.forEach(([data, base, dur]) => {
      const ini = new Date(data + "T07:10:00");
      const fim = new Date(ini.getTime() + (dur || 52) * 60000);
      state.data.sessoes.push({
        perfilId: perfilAtivoId(),
        data, treinoId,
        horaInicio: ini.toISOString(), horaFim: fim.toISOString(), duracaoMin: dur || 52,
        exercicios: t.exercicios.map((ex, k) => ({
          exercicioId: ex.id, nome: ex.nome, concluido: true,
          ...(ex.tipo === "cardio" ? { tipo: "cardio" } : {}),
          series: ex.tipo === "cardio"
            ? Array.from({ length: ex.series }, () => {
              const vel = Math.round((8.2 + (base - 40) * 0.09) * 10) / 10;
              const min = 18 + Math.round((base - 40) * 0.38);
              return { tempo: min, velocidade: vel };
            })
            : Array.from({ length: ex.series }, (_, i) => ({ peso: Math.round((base + k * 2 - i * 1.5) * 2) / 2, reps: 10 })),
        })),
      });
    });
  };
  mk("A", [["2026-09-22", 40], ["2026-09-29", 42.5], ["2026-10-06", 45], ["2026-10-15", 47.5]]);
  mk("B", [["2026-09-24", 25], ["2026-10-01", 27.5], ["2026-10-08", 30]]);
  mk("C", [["2026-09-26", 30], ["2026-10-03", 32.5], ["2026-10-10", 35]]);
  mk("D", [["2026-10-02", 35], ["2026-10-09", 37.5], ["2026-10-20", 40]]);
  state.data.sessoes.sort((a, b) => a.data.localeCompare(b.data));
  saveLocal();
}
