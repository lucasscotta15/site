<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="description" content="Gusto — seu diário e controle de treinos. Sinta o gosto da evolução.">
<title>Gusto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f1115; --bg2:#161a21; --bg3:#1e242e; --line:#2a3240;
    --txt:#e9edf4; --mut:#8b98ab; --acc:#4ade80; --acc2:#22c55e;
    --brand:#4ade80; --brand-dim:rgba(251,191,36,.14); --brand-ink:#121214;
    --warn:#fbbf24; --err:#f87171; --blue:#60a5fa;
    --aman:#fbbf24; --aman2:#e64d00;
    --r:14px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.45; min-height:100dvh;
    padding-bottom:calc(76px + var(--safe-b));
  }
  button,input,select{font-family:inherit; font-size:inherit; color:inherit}
  button{cursor:pointer}
  h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.01em}
  .wrap{max-width:680px; margin:0 auto; padding:0 14px}
  /* header */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(18,18,20,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .hd{display:flex; align-items:center; gap:10px; height:58px}
  .hd h1{font-size:18px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brandname{display:flex; flex-direction:row; align-items:center; gap:9px; justify-content:flex-start; min-width:0; flex:1; line-height:1.05}
  .hdtxt{display:flex; flex-direction:column; justify-content:center; min-width:0}
  .hdlogo{width:30px; height:30px; border-radius:9px; flex:none; display:block}
  .brandname .nm{font-size:20px; font-weight:800; letter-spacing:-.02em; color:var(--txt)}
  .brandname .tag{font-size:10.5px; font-weight:600; color:var(--mut); letter-spacing:.02em; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sync{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 9px;
    border-radius:999px; border:1px solid var(--line); background:var(--bg2); white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
  .dot.ok{background:var(--acc)} .dot.save{background:var(--warn)}
  .dot.err{background:var(--err)} .dot.off{background:var(--mut)}
  @keyframes blink{50%{opacity:.25}}
  .dot.save{animation:blink 1s infinite}
  .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
  /* cards */
  .card{background:var(--bg2); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:12px 0}
  .muted{color:var(--mut)}
  .row{display:flex; align-items:center; gap:10px}
  .sp{flex:1}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:52px; padding:0 18px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg3); font-weight:600; font-size:16px; transition:transform .08s ease;
  }
  .btn:active{transform:scale(.975)}
  .btn.pri{background:var(--brand); border-color:var(--brand); color:#121214}
  .btn.block{width:100%; margin-top:10px}
  .btn.sm{min-height:40px; font-size:14px; padding:0 12px; border-radius:10px}
  .btn.danger{color:var(--err); border-color:#4a2731}
  .btn:disabled{opacity:.5; pointer-events:none}
  /* treinos list */
  .treino-btn{display:block; width:100%; text-align:left; margin-top:10px;
    min-height:64px; padding:12px 14px; border-radius:14px;
    background:var(--bg3); border:1px solid var(--line)}
  .treino-btn .letter{display:inline-flex; align-items:center; justify-content:center;
    width:34px;height:34px;border-radius:10px;background:var(--brand);color:#121214;
    font-weight:800; margin-right:10px; vertical-align:middle}
  .treino-btn .n{font-weight:650}
  .treino-btn .sub{font-size:13px; color:var(--mut); margin-left:44px; margin-top:-4px}
  /* estado da ficha: verde = último treino feito, amarelo = #próximo na rotação A→B→C→D→A */
  .treino-btn .letterwrap{display:inline-flex; align-items:center; gap:8px; margin-right:10px; vertical-align:middle}
  .treino-btn .letterwrap .letter{margin-right:0}
  .tag-prox{display:inline-flex; align-items:center; font-size:11px; font-weight:800; letter-spacing:.01em;
    padding:3px 8px; border-radius:999px; white-space:nowrap;
    color:#121214; background:#fbbf24; border:1px solid #fbbf24; font-weight:900}
  .treino-btn.st-ult{background:rgba(34,197,94,.07)}
  .treino-btn.st-ult .letter{background:var(--acc); color:#121214}
  .treino-btn.st-prox{border:1.5px solid #fbbf24; background:rgba(251,191,36,.10)}
  .treino-btn.st-prox .letter{background:#fbbf24; color:#121214}
  .treino-btn.st-prox .sub{color:#fcd34d}
  /* tabs / nav */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; background:rgba(39,39,42,.98); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding-bottom:var(--safe-b);
  }
  nav.tabs button{
    flex:1; background:none; border:0; color:var(--mut); padding:10px 2px 9px;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:600;
  }
  nav.tabs button.on{color:var(--acc)}
  nav.tabs svg{width:22px;height:22px}
  /* series grid */
  .ex-card{background:var(--bg2); border:1px solid var(--line); border-radius:var(--r); margin:10px 0; overflow:hidden}
  .ex-head{display:flex; align-items:center; gap:10px; padding:13px 14px; background:none; border:0; width:100%; text-align:left}
  .ex-head .name{font-weight:650; flex:1}
  .ex-head .meta{font-size:12px; color:var(--mut)}
  .badge{font-size:11px; padding:3px 7px; border-radius:6px; background:rgba(74,222,128,.13); color:var(--acc); font-weight:700}
  .badge.tempo{background:rgba(96,165,250,.14); color:var(--blue)}
  .chev{transition:transform .2s; color:var(--mut)}
  .ex-card.open .chev{transform:rotate(180deg)}
  .ex-body{display:none; padding:0 12px 12px}
  .ex-card.open .ex-body{display:block}
  .setrow{display:grid; grid-template-columns:34px 1fr 1fr; gap:8px; align-items:center; margin-top:8px}
  .setrow .idx{font-size:13px; color:var(--mut); text-align:center; font-weight:700}
  label.f field{display:block; font-size:10.5px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px}
  input[type=number],input[type=text],input[type=date],select{
    width:100%; min-height:52px; background:var(--bg); border:1px solid var(--line);
    border-radius:10px; padding:0 12px; font-size:18px; font-weight:600;
    -moz-appearance:textfield;
  }
  input[type=number]{text-align:center}
  input:focus,select:focus{outline:2px solid rgba(251,191,36,.55); outline-offset:0; border-color:var(--brand)}
  .last{font-size:12px; color:var(--mut); margin-top:2px}
  .last b{color:var(--acc); white-space:nowrap}
  .last{line-height:1.5}
  .done{background:rgba(74,222,128,.06)}
  /* charts */
  .chart{width:100%; height:220px; display:block; margin-top:6px; touch-action:pan-y}
  .seg{display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:none; min-height:38px; padding:0 12px; border-radius:20px; border:1px solid var(--line);
    background:var(--bg2); font-size:13px; font-weight:600; color:var(--mut)}
  .seg button.on{background:var(--brand); color:#121214; border-color:var(--brand)}
  /* history */
  .hist{display:flex; align-items:center; gap:12px; width:100%; background:var(--bg2); border:1px solid var(--line);
    border-radius:var(--r); padding:13px 14px; margin:9px 0; text-align:left}
  .hist .d{font-weight:700}
  .stat{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; margin-top:10px}
  .stat div{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 4px}
  .stat b{display:block; font-size:19px}
  .stat span{font-size:11px; color:var(--mut)}
  /* editor */
  .editrow{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px; margin:8px 0; display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:end}
  .editrow input[type=text]{min-height:46px; font-size:15px; font-weight:500; min-width:0}
  .editrow input[type=number]{min-height:46px; font-size:15px; width:62px; padding:0 6px}
  .editrow .name{grid-column:1 / -1}
  .editrow .fieldhint{font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:2px}
  .iconbtn{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
  /* dialog */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:50; display:none;
    align-items:flex-end; justify-content:center; padding:0}
  .overlay.show{display:flex}
  .sheet{background:var(--bg2); width:100%; max-width:680px; border-radius:18px 18px 0 0;
    padding:16px 14px calc(18px + var(--safe-b)); border-top:1px solid var(--line); max-height:90dvh; overflow:auto}
  .field{margin:10px 0}
  .field label{display:block; font-size:12.5px; color:var(--mut); margin-bottom:5px; font-weight:600}
  .hidden{display:none !important}
  .center{text-align:center}
  .banner{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; padding:10px 12px; border-radius:12px;
    background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.3); color:#fde68a; font-size:13.5px; margin:10px 0}
  .banner > div:first-child{flex:1 1 200px; min-width:0}
  .banner b{white-space:normal}
  .banner.info{background:rgba(96,165,250,.1); border-color:rgba(96,165,250,.3); color:#bfdbfe}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(88px + var(--safe-b));
    background:#1A1A1D; border:1px solid var(--line); color:var(--txt); padding:10px 16px; border-radius:12px;
    font-size:14px; z-index:60; box-shadow:0 8px 30px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s}
  .toast.show{opacity:1}
  .logo{width:64px;height:64px;border-radius:18px;background:var(--bg);display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 0 0 1px var(--line)}
  .gbtn{display:flex; justify-content:center; min-height:48px; margin:14px 0 4px}
  .tiny{font-size:12px; color:var(--mut)}
  /* cronômetro / timer do treino */
  .timer-card{margin-top:14px}
  .clock{font-variant-numeric:tabular-nums; font-size:40px; font-weight:800; letter-spacing:.02em; line-height:1.1}
  .clock.run{color:var(--acc)}
  .clock.stopped{color:var(--mut)}
  .clock-lbl{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); font-weight:700}
  /* checkbox de exercício concluído */
  .ex-head .chk{width:34px; height:34px; flex:none; border-radius:10px; border:1.5px solid var(--line);
    background:var(--bg); display:grid; place-items:center; color:transparent; font-size:18px; font-weight:800}
  .ex-head .chk.on{background:var(--acc); border-color:var(--acc); color:#121214}
  .ex-card.feito{opacity:.62}
  .ex-card.feito .ex-head .name{text-decoration:line-through; text-decoration-thickness:2px}
  .ex-card.feito{background:rgba(34,197,94,.06)}
  .prog{height:8px; border-radius:99px; background:var(--bg); border:1px solid var(--line); overflow:hidden; margin-top:8px}
  .prog > i{display:block; height:100%; background:var(--brand); width:0; transition:width .25s}
  .metarow{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12.5px; color:var(--mut)}
  .metarow b{color:var(--txt)}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 8px; border-radius:999px;
    background:var(--bg3); border:1px solid var(--line); color:var(--txt); font-weight:650; white-space:nowrap}
  /* observações por exercício */
  .obs-wrap{margin-top:12px}
  .obs-wrap label{display:block; font-size:10.5px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:4px}
  .obs-wrap textarea{width:100%; min-height:54px; resize:vertical; background:var(--bg); border:1px solid var(--line);
    border-radius:10px; padding:9px 11px; font-size:15px; font-weight:500; line-height:1.4; color:var(--txt);
    font-family:inherit; -webkit-appearance:none}
  .obs-wrap textarea:focus{outline:2px solid rgba(251,191,36,.55); border-color:var(--brand)}
  .obs-line{font-size:12.5px; color:#D4D4D8; margin-top:4px; padding-left:9px; border-left:2px solid rgba(96,165,250,.45); white-space:pre-wrap; word-break:break-word}
  .obs-hist{margin-top:10px}
  .obs-hist .oh{display:flex; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; align-items:flex-start}
  .obs-hist .oh:last-child{border-bottom:0}
  .obs-hist .oh time{flex:none; color:var(--mut); font-variant-numeric:tabular-nums; font-size:12.5px; padding-top:1px}
  /* aviso de estagnação de carga */
  .load-warn{margin-top:8px; font-size:12px; line-height:1.4; padding:7px 10px; border-radius:10px;
    background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.32); color:#fde68a;
    display:flex; gap:6px; align-items:flex-start}
  .load-warn b{color:#fbbf24; font-weight:700}
  .mini-warn{display:inline-block; margin-top:3px; font-size:11px; padding:1px 6px; border-radius:6px;
    background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.3); color:#fde68a; font-weight:650}
  /* resumo do mês (home) */
  .mes-card{padding:12px 14px}
  .mes-head{display:flex; align-items:baseline; gap:8px; min-width:0}
  .mes-head h3{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mes-head .cap{font-size:11.5px; color:var(--mut); font-weight:700; white-space:nowrap}
  .mes-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:9px}
  .mes-grid > div{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 4px; text-align:center; min-width:0}
  .mes-grid b{display:block; font-size:20px; line-height:1.15; font-variant-numeric:tabular-nums; font-weight:800; letter-spacing:-.02em}
  .mes-grid span{display:block; font-size:10.5px; color:var(--mut); margin-top:1px; white-space:nowrap}
  .mes-var{display:block; font-size:10.5px; font-weight:700; margin-top:2px; line-height:1.25; white-space:normal; word-break:break-word}
  .up{color:var(--acc)} .down{color:var(--err)} .flat{color:var(--mut)}
  .mes-empty{font-size:12px; color:var(--mut); margin-top:8px}
  /* evolução: quebra por ficha */
  .fichas-mes .fh{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line)}
  .fichas-mes .fh:last-child{border-bottom:0}
  .fichas-mes .lt{width:28px; height:28px; flex:none; border-radius:9px; background:var(--bg3); border:1px solid var(--line);
    display:grid; place-items:center; font-weight:800; font-size:13px}
  .fichas-mes .fx{flex:1; min-width:0}
  .fichas-mes .fn{font-size:14px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .fichas-mes .fd{font-size:12px; color:var(--mut); margin-top:2px}
  .fichas-mes .fd b{color:var(--txt); font-weight:700; font-variant-numeric:tabular-nums}
  .fichas-mes .fd .var{font-weight:800; white-space:nowrap}
  /* exercício de cardio (esteira / bicicleta) */
  .badge.cardio{background:rgba(96,165,250,.16); color:#93c5fd}
  .cblock{display:grid; grid-template-columns:26px minmax(0,1fr); gap:8px; align-items:start; margin-top:10px;
    padding-top:10px; border-top:1px solid rgba(42,50,64,.7)}
  .cblock:first-of-type{border-top:0}
  .cblock .cidx{font-size:13px; color:var(--mut); text-align:center; font-weight:800; padding-top:26px}
  .cgrid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 8px; min-width:0}
  .ccell{min-width:0}
  .ccell .lb{display:block; font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em;
    font-weight:700; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ccell .lb i{font-style:normal; text-transform:none; letter-spacing:0; font-weight:600; opacity:.65; font-size:9.5px}
  .ccell input{min-height:46px !important; font-size:16px !important; padding:0 8px !important; border-radius:9px}
  .reqdot{color:var(--acc); font-weight:900}
  input.req-empty{border-color:rgba(251,191,36,.6) !important; background:rgba(251,191,36,.05)}
  .csec{display:flex; align-items:center; gap:6px; margin:10px 0 0; font-size:10.5px; color:var(--mut);
    text-transform:uppercase; letter-spacing:.06em; font-weight:700}
  .csec b{color:var(--acc); font-weight:900}
  .ckpi{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px}
  .ckpi > div{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:7px 4px; text-align:center; min-width:0}
  .ckpi b{display:block; font-size:15px; font-variant-numeric:tabular-nums; font-weight:800; white-space:nowrap}
  .ckpi span{display:block; font-size:9.5px; color:var(--mut); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cseg{display:inline-flex; padding:3px; border-radius:10px; background:var(--bg); border:1px solid var(--line); gap:3px}
  .cseg button{min-height:32px; padding:0 9px; border-radius:8px; border:1px solid transparent; background:none;
    color:var(--mut); font-size:12px; font-weight:700}
  .cseg button.on{background:var(--brand); color:#121214; border-color:var(--brand)}
  .chart-wrap{position:relative}
  .chart-legend{display:flex; gap:14px; font-size:11.5px; color:var(--mut); margin-top:2px; flex-wrap:wrap}
  .chart-legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px}
  /* seletor de tipo no editor de ficha */
  .tipo-seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:3px}
  .tipo-seg button{min-height:42px; border-radius:10px; border:1px solid var(--line); background:var(--bg);
    color:var(--mut); font-size:12.5px; font-weight:700; padding:0 4px; display:flex; align-items:center; justify-content:center; gap:4px}
  .tipo-seg button.on{background:rgba(74,222,128,.16); border-color:var(--acc); color:var(--acc)}
  .tipo-seg button.blue.on{background:rgba(96,165,250,.16); border-color:#60a5fa; color:#93c5fd}

  /* ===== aba Corpo (medições e composição corporal) ===== */
  nav.tabs button{font-size:10.5px; padding:9px 1px 8px}
  nav.tabs svg{width:21px;height:21px}
  .perfil-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 8px; margin-top:8px}
  .perfil-grid .full{grid-column:1 / -1}
  .pfcell{min-width:0}
  .pfcell .lb{display:block; font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em;
    font-weight:700; margin-bottom:3px}
  .pfcell input, .pfcell select{min-height:46px !important; font-size:16px !important; padding:0 8px !important; border-radius:9px}
  .pfcell select{text-align:left}
  .cseg-l{display:flex; gap:6px; margin-top:2px}
  .cseg-l button{flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--bg);
    color:var(--mut); font-weight:700; font-size:14px}
  .cseg-l button.on{background:var(--brand); border-color:var(--brand); color:#121214}
  .kpi-body{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px}
  .kbox{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:9px 10px; min-width:0; position:relative}
  .kbox .kl{font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:14px}
  .kbox .kv{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em; line-height:1.2}
  .kbox .ks{font-size:11px; color:var(--mut); margin-top:1px}

 "reps"}, {"id": "c7", "nome": "Prancha isométrica", "series": 3, "reps": "30 s", "tipo": "tempo"}]}, {"id": "D", "nome": "Costas e Bíceps", "exercicios": [{"id": "d1", "nome": "Puxada alta", "series": 3, "reps": "8 a 12", "tipo": "reps"}, {"id": "d2", "nome": "Remada baixa", "series": 3, "reps": "8 a 12", "tipo": "reps"}, {"id": "d3", "nome": "Crucifixo invertido na máquina", "series": 3, "reps": "8 a 12", "tipo": "reps"}, {"id": "d4", "nome": "Rosca direta no cross", "series": 3, "reps": "8 a 12", "tipo": "reps"}, {"id": "d5", "nome": "Rosca martelo", "series": 3, "reps": "8 a 12", "tipo": "reps"}, {"id": "d6", "nome": "Rosca Scott", "series": 3, "reps": "8 a 12", "tipo": "reps"}]}];

/* ============================================================
   Utilidades
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, html) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  if (html !== undefined) {
    // nunca stringificar um nó: isso removeria o elemento do DOM (bug de re-render)
    if (html instanceof Node) n.appendChild(html);
    else n.innerHTML = html;
  }
  return n;
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtBR = (iso) => { const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };
const fmtBRshort = (iso) => { const [, m, d] = iso.split("-"); return `${d}/${m}`; };
const uid = (p = "x") => p + Math.random().toString(36).slice(2, 9);
const num = (v) => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function stampWeek(iso) {
  const d = new Date(iso + "T12:00:00");
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}

/* ---------- perfis (família usa o mesmo aparelho) ----------
   COMPARTILHADO: treinos (fichas A/B/C/D — a academia é a mesma).
   POR PERFIL: sessoes, medicoes e os dados do perfil (sexo/idade/altura/metas).
   Item de sessão/medição sem `perfilId` é do perfil ATIVO (retrocompatível). */
function perfisArr() {
  if (!state.data) return [];
  if (!Array.isArray(state.data.perfis)) state.data.perfis = [];
  return state.data.perfis;
}
function perfilAtivo() {
  const arr = perfisArr();
  const id = state.data.perfilAtivoId;
  const p = arr.find(x => x && x.id === id);
  if (p) return p;
  if (arr.length) { state.data.perfilAtivoId = arr[0].id; return arr[0]; }
  return null;
}
function perfilAtivoId() { const p = perfilAtivo(); return p ? p.id : null; }
/** true quando o item pertence ao perfil ativo (sem perfilId = do perfil ativo) */
function doPerfilAtivo(item) {
  if (!item) return false;
  if (!item.perfilId) return true;
  return item.perfilId === perfilAtivoId();
}
/** fichas do perfil ativo (treino sem perfilId = do perfil ativo, retrocompatível) */
function treinosDoPerfil() {
  const arr = Array.isArray(state.data.treinos) ? state.data.treinos : [];
  return arr.filter(doPerfilAtivo);
}
function getTreino(id) {
  return state.data.treinos.find(t => t.id === id && doPerfilAtivo(t));
}
/** ids de exercício únicos dentro de um perfil (fichas novas não colidem com as do perfil 1) */
function idsExistentesDoPerfil(exceto) {
  const s = new Set();
  for (const t of treinosDoPerfil()) {
    if (t === exceto) continue;
    for (const ex of t.exercicios || []) s.add(ex.id);
  }
  return s;
}
/** cópia das fichas padrão para o perfil ativo, com ids novos (sufixo do perfil) */
function fichasPadraoParaPerfil(pid) {
  const suf = "-" + String(pid).replace(/[^a-z0-9]/gi, "").slice(-4).toLowerCase();
  return clone(TREINOS_PADRAO).map(t => ({
    ...t,
    perfilId: pid,
    exercicios: (t.exercicios || []).map(ex => ({ ...ex, id: ex.id + suf })),
  }));
}
function sessoesDoPerfil() {
  const arr = Array.isArray(state.data.sessoes) ? state.data.sessoes : [];
  return arr.filter(doPerfilAtivo);
}
function medicoesDoPerfil() {
  const arr = Array.isArray(state.data.medicoes) ? state.data.medicoes : [];
  return arr.filter(doPerfilAtivo);
}
/** grava o perfilId nos itens sem dono (migração de dados antigos para o perfil ativo) */
function migrarItensSemPerfil() {
  const id = perfilAtivoId();
  if (!id) return;
  for (const arr of [state.data.treinos, state.data.sessoes, state.data.medicoes]) {
    if (!Array.isArray(arr)) continue;
    for (const it of arr) if (it && !it.perfilId) it.perfilId = id;
  }
}
/** nome do perfil (nunca vazio: é o que identifica) */
function nomePerfil(p) {
  const n = p && typeof p.nome === "string" ? p.nome.trim() : "";
  return n || "Sem nome";
}
/** idade a partir da data de nascimento (yyyy-mm-dd) */
function idadeDeNascimento(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return null;
  const [y, m, d] = iso.split("-").map(Number);
  const h = new Date();
  let a = h.getFullYear() - y;
  if (h.getMonth() + 1 < m || (h.getMonth() + 1 === m && h.getDate() < d)) a--;
  return (a >= 0 && a <= 120) ? a : null;
}
/** próximo nome livre: "Perfil 1", "Perfil 2"… */
function proximoNomePerfil() {
  const usados = new Set(perfisArr().map(p => nomePerfil(p).toLowerCase()));
  let k = perfisArr().length + 1;
  while (usados.has(("perfil " + k).toLowerCase())) k++;
  return "Perfil " + k;
}
/** estado padrão de um perfil novo */
function novoPerfilObj(dados) {
  return {
    id: uid("p"),
    nome: "",
    sexo: null, nascimento: null, idade: null, alturaCm: null,
    meta: { pesoKg: null, cinturaCm: null, gorduraPct: null },
    metodoPadrao: "faulkner",
    ...(dados || {}),
  };
}
/** iniciais para o avatar (ex.: "Scotta" → "S", "Lucas Scotta" → "LS") */
function iniciais(nome) {
  const ps = String(nome || "").trim().split(/\s+/).filter(Boolean);
  if (!ps.length) return "?";
  return (ps.length === 1 ? ps[0].slice(0, 1) : ps[0].slice(0, 1) + ps[ps.length - 1].slice(0, 1)).toUpperCase();
}
/** cria as fichas padrão para o perfil ativo (ids com sufixo do perfil: sem colisão) */
function criarFichasPadrao() {
  const pid = perfilAtivoId();
  if (!pid) return;
  if (treinosDoPerfil().length) return toast("Este perfil já tem fichas");
  const novas = fichasPadraoParaPerfil(pid);
  state.data.treinos.push(...novas);
  saveLocal(); scheduleSync(); render();
  toast("4 fichas padrão criadas");
}
function trocarPerfil(id) {
  if (!perfisArr().some(p => p && p.id === id)) return;
  if (state.data.perfilAtivoId === id) return;
  state.data.perfilAtivoId = id;
  if (state.sessao) { stopTick(); state.sessao = null; clearRascunho(); }
  state.openEx = {};
  state.chartEx = {};
  state.chartCardio = null;
  CORPO_ACAO = null; MEDICAO_EDIT = null; state.corpoForm = false;
  saveLocal(); scheduleSync();
  render();
  window.scrollTo({ top: 0 });
  toast("Perfil: " + nomePerfil(perfilAtivo()));
}

/* ---------- resumo mensal ---------- */
const MESES_PT = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
/** {ano, mes} do mês real do aparelho (fuso local) */
function mesAtual() { const d = new Date(); return { ano: d.getFullYear(), mes: d.getMonth() }; }
/** desloca um {ano,mes} em n meses (n pode ser negativo) */
function somaMes(m, n) {
  const total = m.ano * 12 + m.mes + n;
  return { ano: Math.floor(total / 12), mes: ((total % 12) + 12) % 12 };
}
/** comparação por string "YYYY-MM" — nunca converte para UTC */
const mesKey = (m) => `${m.ano}-${pad2(m.mes + 1)}`;
const nomeMes = (m) => MESES_PT[m.mes];
/** métricas de um mês: treinos, exercícios concluídos, minutos, por ficha */
function resumoMes(m) {
  const k = mesKey(m);
  const out = { key: k, nome: nomeMes(m), treinos: 0, exConcluidos: 0, minutos: 0, porFicha: {} };
  const arr = sessoesDoPerfil();
  for (const s of arr) {
    if (!s || !s.data) continue;
    if (String(s.data).slice(0, 7) !== k) continue;
    out.treinos++;
    const fid = String(s.treinoId || "").trim().toUpperCase();
    if (fid) out.porFicha[fid] = (out.porFicha[fid] || 0) + 1;
    const exs = Array.isArray(s.exercicios) ? s.exercicios : [];
    out.exConcluidos += exs.filter(x => x && x.concluido === true).length;
    const d = num(s.duracaoMin);
    if (d != null && isFinite(d)) out.minutos += d;
  }
  out.minutos = Math.round(out.minutos);
  return out;
}
/** minutos e km de cardio feitos no mês (só exercícios do tipo cardio) */
function resumoCardioMes(m) {
  const k = mesKey(m);
  const out = { key: k, minutos: 0, km: 0, sessoes: 0 };
  const arr = sessoesDoPerfil();
  for (const s of arr) {
    if (!s || !s.data || String(s.data).slice(0, 7) !== k) continue;
    const cex = (Array.isArray(s.exercicios) ? s.exercicios : []).filter(x => x && x.tipo === "cardio");
    if (!cex.length) continue;
    out.sessoes++;
    for (const e of cex) {
      const st = cardioStats(e.series);
      out.minutos += st.tempoTotal || 0;
      out.km += st.distTotal || 0;
    }
  }
  return out;
}

/** texto da variação: "↑2 vs setembro" | "↓1 vs setembro" | "= igual a setembro" | "sem dados de setembro" */
function varMes(atual, anterior) {
  // sem treino no mês anterior: nada de divisão por zero nem "↑9" falso
  if (!anterior.treinos) {
    return { txt: `sem dados de ${anterior.nome}`, cls: "flat", delta: null };
  }
  const d = atual.treinos - anterior.treinos;
  if (d > 0) return { txt: `↑${d} vs ${anterior.nome}`, cls: "up", delta: d };
  if (d < 0) return { txt: `↓${Math.abs(d)} vs ${anterior.nome}`, cls: "down", delta: d };
  return { txt: `= igual a ${anterior.nome}`, cls: "flat", delta: 0 };
}
/** "3× em outubro · 2× em setembro (↑1)" */
function linhaFichaMes(agora, ant, fid) {
  const a = agora.porFicha[fid] || 0;
  const b = ant.porFicha[fid] || 0;
  let varTxt = "";
  if (!b) varTxt = `<span class="var flat">sem dados de ${ant.nome}</span>`;
  else if (a > b) varTxt = `<span class="var up">↑${a - b}</span>`;
  else if (a < b) varTxt = `<span class="var down">↓${b - a}</span>`;
  else varTxt = `<span class="var flat">=</span>`;
  return `<b>${a}×</b> em ${agora.nome} · <b>${b}×</b> em ${ant.nome} (${varTxt})`;
}

/* ---------- cronômetro / horários ---------- */
const pad2 = (n) => String(n).padStart(2, "0");
/** segundos -> "H:MM:SS" (ou "MM:SS" quando menos de 1h) */
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`;
}
/** segundos -> "52 min" | "1h05" | "1 min 20 s" (para histórico) */
function fmtDuracao(seg) {
  seg = Math.max(0, Math.round(seg || 0));
  const m = Math.round(seg / 60);
  if (seg < 60) return "<1 min";
  if (m < 60) return m + " min";
  return Math.floor(m / 60) + "h" + pad2(m % 60);
}
/* ---------- cardio: tempo / velocidade / distância / inclinação ---------- */
/** minutos (aceita "24", "24,5", "24:30" ou "1:05:00") -> minutos decimais | null */
function parseTempoMin(v) {
  if (v === "" || v === null || v === undefined) return null;
  const t = String(v).trim().replace(",", ".");
  if (!t) return null;
  const hm = t.match(/^(\d{1,3}):(\d{1,2})(?::(\d{1,2}))?$/);
  if (hm) {
    const a = +hm[1], b = +hm[2], c = hm[3] != null ? +hm[3] : null;
    return c == null ? a + b / 60 : a + b / 60 + c / 3600;
  }
  const n = num(t);
  return n != null && isFinite(n) && n >= 0 ? n : null;
}
/** minutos decimais -> "24:30" (mm:ss) */
function fmtTempoMin(min) {
  if (min == null || !isFinite(min)) return "–";
  const total = Math.round(min * 60);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), sg = total % 60;
  return h ? `${h}:${pad2(m)}:${pad2(sg)}` : `${pad2(m)}:${pad2(sg)}`;
}
/** km/h com 1 casa decimal, vírgula decimal */
const fmtVel = (v) => (v == null || !isFinite(v)) ? "–" : (Math.round(v * 10) / 10).toFixed(1).replace(".", ",");
/** km com 2 casas (mín. 1); sem valor -> null (não imprime "0,00") */
function fmtKm(v) {
  if (v == null || !isFinite(v)) return null;
  const r = Math.round(v * 100) / 100;
  return (Number.isInteger(r * 10) ? r.toFixed(1) : r.toFixed(2)).replace(".", ",");
}
/** "12,5 km/h · 24:30" a partir de uma série de cardio */
function fmtCardioSerie(se) {
  const parts = [];
  if (se && se.velocidade != null) parts.push(fmtVel(se.velocidade) + " km/h");
  if (se && se.tempo != null) parts.push(fmtTempoMin(se.tempo));
  if (se && se.distancia != null) parts.push(fmtKm(se.distancia) + " km");
  return parts.join(" · ");
}
/** série em branco de cardio, já com o último registro como placeholder */
function blankCardioSeries(n, last) {
  return Array.from({ length: n }, (_, i) => {
    const prev = last && last.series && last.series[i] ? last.series[i] : null;
    return {
      tempo: "", velocidade: "",
      distancia: "", inclinacao: "",
      prevTempo: prev && prev.tempo != null ? prev.tempo : null,
      prevVel: prev && prev.velocidade != null ? prev.velocidade : null,

}
/** validação de cardio: tempo e velocidade obrigatórios em TODAS as séries */
function cardioFaltando(ex) {
  const falt = [];
  (ex.series || []).forEach((se, i) => {
    const falta = [];
    if (parseTempoMin(se.tempo) == null) falta.push("tempo");
    if (num(se.velocidade) == null) falta.push("velocidade");
    if (falta.length) falt.push({ i, falta });
  });
  return falt;
}
/** agrupa séries de cardio: tempo total, velocidade (média/máx), distância, inclinação */
function cardioStats(series) {
  const s = Array.isArray(series) ? series : [];
  const tempos = s.map(v => v && v.tempo).filter(v => v != null);
  const vels = s.map(v => v && v.velocidade).filter(v => v != null);
  const dists = s.map(v => v && v.distancia).filter(v => v != null);
  const incs = s.map(v => v && v.inclinacao).filter(v => v != null);
  return {
    tempoTotal: tempos.length ? tempos.reduce((a, b) => a + b, 0) : null,
    velAvg: vels.length ? vels.reduce((a, b) => a + b, 0) / vels.length : null,
    velMax: vels.length ? Math.max(...vels) : null,
    distTotal: dists.length > 1 ? dists.reduce((a, b) => a + b, 0) : (dists.length ? dists[0] : null),
    incMax: incs.length ? Math.max(...incs) : null,
  };
}
/** pontos {data, vel, dist} de um exercício de cardio (uma sessão por dia) */
function cardioForChart(exId) {
  const porDia = new Map();
  for (const s of [...sessoesDoPerfil()].sort((a, b) => a.data.localeCompare(b.data))) {
    const ex = (s.exercicios || []).find(x => x && x.exercicioId === exId);
    if (!ex || !Array.isArray(ex.series) || !ex.series.length) continue;
    const st = cardioStats(ex.series);
    if (st.velAvg == null && st.distTotal == null) continue;
    porDia.set(s.data, { data: s.data, vel: st.velAvg, velMax: st.velMax, dist: st.distTotal, tempo: st.tempoTotal, inc: st.incMax });
  }
  return [...porDia.values()].sort((a, b) => a.data.localeCompare(b.data));
}
const fmtHora = (iso) => {
  if (!iso) return "–";
  const d = new Date(iso);
  if (isNaN(d)) return "–";
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
};
/** segundos desde o início até agora (ou até o fim) */
function elapsedSec(s) {
  if (!s || !s.horaInicio) return 0;
  const ini = new Date(s.horaInicio).getTime();
  if (!isFinite(ini)) return 0;
  const fim = s.horaFim ? new Date(s.horaFim).getTime() : Date.now();
  const total = Math.floor((fim - ini) / 1000);
  // corrige relógio do aparelho que anda para trás
  if (s.duracaoMin != null && s.horaFim) return Math.round(s.duracaoMin * 60);
  return Math.max(0, total);
}
function totalEx(s) { return s.exercicios.length; }
function doneEx(s) { return s.exercicios.filter(x => x.concluido).length; }

/** normaliza UM perfil (defensivo) */
function normalizePerfil(pf) {
  const p = (pf && typeof pf === "object") ? pf : {};
  const meta = (p.meta && typeof p.meta === "object") ? p.meta : {};
  const nome = typeof p.nome === "string" && p.nome.trim() ? p.nome.trim().slice(0, 40) : "";
  const nasc = /^\d{4}-\d{2}-\d{2}$/.test(String(p.nascimento || "")) ? String(p.nascimento).slice(0, 10) : null;
  let idade = num(p.idade) != null ? Math.round(num(p.idade)) : null;
  // nascimento manda: calcula a idade atual (dados antigos só tinham idade)
  if (nasc) { const ia = idadeDeNascimento(nasc); if (ia != null) idade = ia; }
  return {
    id: String(p.id || uid("p")),
    nome,
    sexo: (p.sexo === "M" || p.sexo === "F") ? p.sexo : null,
    nascimento: nasc,
    idade,
    alturaCm: num(p.alturaCm),
    meta: { pesoKg: num(meta.pesoKg), cinturaCm: num(meta.cinturaCm), gorduraPct: num(meta.gorduraPct) },
    metodoPadrao: p.metodoPadrao === "navy" ? "navy" : "faulkner",
  };
}
function normalizeData(d) {
  const out = { treinos: [], sessoes: [], medicoes: [], perfis: [], perfilAtivoId: null, aceitouAvisoMedico: false };
  if (!d || typeof d !== "object") return defaultData();
  // fichas dos perfis já conhecidos, para saber quais perfilId são válidos
  const perfisConhecidos = new Set();
  if (Array.isArray(d.perfis)) d.perfis.forEach(x => x && x.id && perfisConhecidos.add(String(x.id)));
  if (d.perfil && typeof d.perfil === "object") perfisConhecidos.add("p1");
  if (d.perfilAtivoId) perfisConhecidos.add(String(d.perfilAtivoId));
  const treinos = Array.isArray(d.treinos) ? d.treinos : [];
  for (const t of treinos) {
    if (!t || typeof t !== "object") continue;
    const exs = Array.isArray(t.exercicios) ? t.exercicios : [];
    out.treinos.push({
      perfilId: (t.perfilId && perfisConhecidos.has(String(t.perfilId))) ? String(t.perfilId) : (t.perfilId ? String(t.perfilId) : (d.perfilAtivoId || (d.perfil ? "p1" : null))),
      id: String(t.id || uid("t")),
      nome: String(t.nome || "Treino"),
      exercicios: exs.filter(x => x && x.nome).map(x => ({
        id: String(x.id || uid("e")),
        nome: String(x.nome),
        series: Math.max(1, Math.min(20, parseInt(x.series, 10) || 3)),
        reps: String(x.reps ?? "8 a 12"),
        tipo: (x.tipo === "tempo" || x.tipo === "cardio") ? x.tipo : "reps",
        ...(x.tipo === "cardio" ? { cardio: 1 } : {}),
      })),
    });
  }
  // SÓ usa as fichas padrão quando não há NENHUMA ficha no arquivo (primeiro uso).
  // Perfil novo começa sem fichas — a pessoa escolhe criar as padrão ou do zero.
  if (!out.treinos.length && !(Array.isArray(d.treinos) && d.treinos.length)) out.treinos = fichasPadraoParaPerfil(out.perfilAtivoId || "p1");
  // ---- perfis (aba Corpo) ----
  // MIGRAÇÃO RETROCOMPATÍVEL: JSON antigo tem só `perfil` (objeto) → vira perfis:[{id:'p1', ...perfil}].
  // Nenhum dado é descartado: nome ausente fica "" (exibido como "Perfil 1" se for o único).
  const perfisIn = Array.isArray(d.perfis) ? d.perfis.filter(x => x && typeof x === "object") : [];
  if (perfisIn.length) {
    const vistos = new Set();
    for (const pf of perfisIn) {
      const p = normalizePerfil(pf);
      while (vistos.has(p.id)) p.id = uid("p");
      vistos.add(p.id);
      out.perfis.push(p);
    }
  } else if (d.perfil && typeof d.perfil === "object") {
    out.perfis.push(normalizePerfil(Object.assign({ id: "p1" }, d.perfil)));
  } else if (state.data && Array.isArray(state.data.perfis) && state.data.perfis.length) {
    // sem perfil no arquivo: mantém os perfis já carregados (nunca perde quem já usa)
    out.perfis = state.data.perfis.map(p => normalizePerfil(p));
  }
  // o primeiro perfil sempre tem id estável ('p1' na migração) e nome válido
  out.perfis.forEach((p, i) => {
    if (!p.nome) p.nome = out.perfis.length === 1 ? "Perfil 1" : "Perfil " + (i + 1);
  });
  const idsValidos = out.perfis.map(p => p.id);
  const ativo = d.perfilAtivoId || (state.data && state.data.perfilAtivoId) || null;
  out.perfilAtivoId = idsValidos.includes(ativo) ? ativo : (idsValidos[0] || null);
  const ativoPerfil = out.perfis.find(p => p.id === out.perfilAtivoId)
    || { sexo: null, alturaCm: null, meta: {} };
  // perfis achados por id (para recalcular Navy de cada dono)
  const perfilDe = (pid) => out.perfis.find(p => p.id === pid) || ativoPerfil;
  out.aceitouAvisoMedico = d.aceitouAvisoMedico === true;
  // ---- medições antropométricas (aba Corpo) ----
  const meds = Array.isArray(d.medicoes) ? d.medicoes : [];
  const nums = (o) => {
    const out2 = {};
    if (!o || typeof o !== "object") return out2;
    for (const [k, v] of Object.entries(o)) { const x = num(v); if (x != null) out2[k] = x; }
    return out2;
  };
  const METS = ["faulkner", "navy", "inbody", "balanca", "nenhum"];
  for (const m of meds) {
    if (!m || typeof m !== "object") continue;
    const data = String(m.data || "").slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) continue;
    const fonte = m.fonte === "medica" || m.fonte === "academia" || m.fonte === "balanca_casa" || m.fonte === "outra"
      ? m.fonte
      : (String(m.fonte || "").toLowerCase().includes("inbody") ? "medica"
        : String(m.fonte || "").toLowerCase().includes("academia") ? "academia"
        : String(m.fonte || "").toLowerCase().includes("balan") ? "balanca_casa" : "outra");
    const metodo = METS.includes(m.metodo) ? m.metodo
      : (fonte === "medica" ? "inbody" : fonte === "academia" ? "faulkner" : fonte === "balanca_casa" ? "balanca" : "nenhum");
    out.medicoes.push({
      id: String(m.id || uid("med")),
      perfilId: (m.perfilId && idsValidos.includes(String(m.perfilId))) ? String(m.perfilId) : (m.perfilId ? String(m.perfilId) : out.perfilAtivoId),
      data,
      peso: num(m.peso), cintura: num(m.cintura), quadril: num(m.quadril), pescoco: num(m.pescoco),
      perimetros: nums(m.perimetros), dobras: nums(m.dobras), pollock: nums(m.pollock),
      profissional: nums(m.profissional),
      fonte, metodo,
      gordura: num(m.gordura), gorduraFaulkner: num(m.gorduraFaulkner), gorduraNavy: num(m.gorduraNavy),
      gorduraBalanca: num(m.gorduraBalanca), gorduraInbody: num(m.gorduraInbody),
      obs: typeof m.obs === "string" ? m.obs : "",
    });
  }
  out.medicoes.sort((a, b) => a.data.localeCompare(b.data));
  for (const m of out.medicoes) {
    // deriva a gordura do método quando o dado permite (dados antigos podem ter só peso/medidas)
    if (m.metodo === "faulkner" && m.gorduraFaulkner == null) {
      const f = calcFaulkner(m.dobras);
      if (f) { m.gorduraFaulkner = Math.round(f.valor * 10) / 10; if (m.gordura == null) m.gordura = m.gorduraFaulkner; }
    }
    if (m.metodo === "navy" && m.gorduraNavy == null) {
      const dono = perfilDe(m.perfilId);
      const nv = calcNavy(m, dono.sexo, dono.alturaCm);
      if (nv) { m.gorduraNavy = Math.round(nv.valor * 10) / 10; if (m.gordura == null) m.gordura = m.gorduraNavy; }
    }
    if (m.metodo === "inbody" && m.gorduraInbody == null) {
      const gi = num(m.profissional && m.profissional.gorduraPct);
      if (gi != null) { m.gorduraInbody = gi; if (m.gordura == null) m.gordura = gi; }
    }
    if (m.metodo === "balanca" && m.gorduraBalanca == null) {
      const gb = num(m.profissional && m.profissional.gorduraPct);
      if (gb != null) { m.gorduraBalanca = gb; if (m.gordura == null) m.gordura = gb; }
    }
  }
  const sessoes = Array.isArray(d.sessoes) ? d.sessoes : [];
  const fim = Array.isArray(d.sessoes) ? d.sessoes : [];
  for (const s of fim) {
    if (!s || !s.data) continue;
    const reg = {
      perfilId: (s.perfilId && idsValidos.includes(String(s.perfilId))) ? String(s.perfilId) : (s.perfilId ? String(s.perfilId) : out.perfilAtivoId),
      data: String(s.data).slice(0, 10),
      treinoId: String(s.treinoId || ""),
      exercicios: (Array.isArray(s.exercicios) ? s.exercicios : []).filter(x => x && x.exercicioId).map(x => {
        const ex = {
          exercicioId: String(x.exercicioId),
          nome: String(x.nome || ""),
          concluido: x.concluido === true,
          obs: typeof x.obs === "string" ? x.obs : "",   // retrocompatível: sessões antigas não têm
          series: (Array.isArray(x.series) ? x.series : []).filter(v => v).map(v => {
            // retrocompatível: séries antigas só têm {peso, reps}; cardio tem {tempo, velocidade, ...}
            const se = {
              peso: num(v.peso), reps: v.reps === "" || v.reps === undefined || v.reps === null ? null : (num(v.reps)),
            };
            if (v.tempo !== undefined) se.tempo = parseTempoMin(v.tempo);
            if (v.velocidade !== undefined) se.velocidade = num(v.velocidade);
            if (v.distancia !== undefined) se.distancia = num(v.distancia);
            if (v.inclinacao !== undefined) se.inclinacao = num(v.inclinacao);
            return se;
          }),
        };
        if (x.tipo === "cardio") ex.tipo = "cardio";
        return ex;
      }),
    };
    // horários e duração (retrocompatível: sessões antigas não têm)
    const hi = s.horaInicio ? new Date(s.horaInicio) : null;
    const hf = s.horaFim ? new Date(s.horaFim) : null;
    if (hi && !isNaN(hi)) reg.horaInicio = hi.toISOString();
    if (hf && !isNaN(hf)) reg.horaFim = hf.toISOString();
    let dur = num(s.duracaoMin);
    if (dur == null && reg.horaInicio && reg.horaFim) dur = Math.round((new Date(reg.horaFim) - new Date(reg.horaInicio)) / 60000);
    if (dur != null) reg.duracaoMin = dur;
    out.sessoes.push(reg);
  }
  return out;
}

let gisPromise = null;
function loadGIS() {
  if (window.google?.accounts?.oauth2) return Promise.resolve(true);
  if (gisPromise) return gisPromise;
  gisPromise = new Promise((res) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = () => res(true);
    s.onerror = () => { console.warn("GIS indisponível (offline?)"); gisPromise = null; res(false); };
    document.head.appendChild(s);
    setTimeout(() => { if (!window.google?.accounts?.oauth2) res(false); }, 8000);
  });
  return gisPromise;
}

function setToken(token, expiresIn) {
  state.token = token;
  state.logged = true;
  try {
    sessionStorage.setItem(LS_TOKEN, JSON.stringify({ token, exp: Date.now() + (expiresIn - 60) * 1000 }));
  } catch (e) {}
}
function loadToken() {
  try {
    const raw = sessionStorage.getItem(LS_TOKEN);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (o && o.token && o.exp > Date.now()) return o.token;
  } catch (e) {}
  return null;
}
function clearToken() {
  state.token = null; state.logged = false;
  try { sessionStorage.removeItem(LS_TOKEN); sessionStorage.removeItem(LS_USER); } catch (e) {}
}

function requestToken(prompt) {
  return new Promise(async (res) => {
    const ok = await loadGIS();
    if (!ok || !window.google?.accounts?.oauth2) { res(false); return; }
    try {
      const tc = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPES, prompt: prompt || "",
        callback: (resp) => {
          if (resp && resp.access_token) { setToken(resp.access_token, resp.expires_in || 3500); res(true); }
          else { console.warn("GIS resp", resp?.error || resp); res(false); }
        },
        error_callback: (err) => { console.warn("GIS err", err); res(false); },
      });
      tc.requestAccessToken(prompt ? { prompt } : {});
    } catch (e) { console.warn(e); res(false); }
  });
}

let fileId = null;

async function driveFetch(url, opts = {}) {
  const token = state.token || loadToken();
  if (!token) throw new Error("NO_TOKEN");
  state.token = token;
  const headers = Object.assign({}, opts.headers || {}, { Authorization: "Bearer " + token });
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401) { clearToken(); throw new Error("AUTH"); }
  if (!r.ok) {
    let msg = "HTTP " + r.status;
    try { const j = await r.json(); msg = j.error?.message || msg; } catch (e) {}
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return r;
}

async function findFile() {
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)&pageSize=10`);
  const j = await r.json();
  const f = (j.files || [])[0];
  return f ? f.id : null;
}

async function createFile(payload) {
  const boundary = "academia_" + Date.now().toString(36);
  const meta = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${payload}\r\n--${boundary}--`;
  const r = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST", headers: { "Content-Type": `multipart/related; boundary=${boundary}` }, body,
  });
  const j = await r.json();
  return j.id;
}

async function updateFile(id, payload) {
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id`, {
    method: "PATCH", headers: { "Content-Type": "application/json; charset=UTF-8" }, body: payload,
  });
}

async function downloadFile(id) {
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  return await r.json();
}

/* estado de sincronização */
const sync = { state: "local", retry: 0, timer: null };
function setSync(s, label) {
  sync.state = s;
  const dot = $("#syncDot"), txt = $("#syncTxt");
  if (!dot) return;
  dot.className = "dot " + ({ saved: "ok", saving: "save", error: "err", local: "off", offline: "off" }[s] || "off");
  txt.textContent = label || ({ saved: "salvo", saving: "salvando", error: "erro", local: "local", offline: "offline" }[s]) || s;
}

function hasToken() { return !!(state.token || loadToken()); }

function scheduleSync(delay = 900) {
  state.dirty = true;
  if (!hasToken()) { setSync("local", "local"); return; }
  if (!navigator.onLine) { setSync("offline"); return; }
  clearTimeout(sync.timer);
  sync.timer = setTimeout(doSync, delay);
}

async function doSync() {
  if (!hasToken()) { setSync("local", "local"); return; }
  if (state.saving) return;
  state.saving = true;
  setSync("saving");
  const snapshot = JSON.stringify(state.data);
  try {
    if (!fileId) fileId = await findFile();
    if (fileId) await updateFile(fileId, snapshot);
    else fileId = await createFile(snapshot);
    state.dirty = false;
    sync.retry = 0;
    setSync("saved");
  } catch (e) {
    console.warn("sync falhou", e);
    if (e.message === "AUTH") { clearToken(); setSync("needlogin"); }
    else if (e.message === "NO_TOKEN") setSync("local", "local");
    else if (!navigator.onLine) setSync("offline");
    else setSync("error");
    // retry com backoff
    if (sync.retry < 5 && navigator.onLine && e.message !== "AUTH") {
      const d = Math.min(30000, 1500 * Math.pow(2, sync.retry++));
      clearTimeout(sync.timer);
      sync.timer = setTimeout(doSync, d);
    }
  } finally {
    state.saving = false;
  }
}

async function pullFromDrive() {
  setSync("saving", "baixando");
  try {
    fileId = await findFile();
    if (!fileId) {
      // primeiro uso: envia os dados locais (ou padrão) para o Drive
      await doSync();
      return;
    }
    const remote = normalizeData(await downloadFile(fileId));
    const local = state.data;
    const remoteCount = remote.sessoes.length, localCount = local ? local.sessoes.length : 0;
    if (local && localCount > remoteCount) {
      // local tem mais dados (por exemplo, treinos feitos offline) → mantém local e envia
      toast("Enviando treinos offline para o Drive…");
      await doSync();
    } else {
      state.data = remote;
      saveLocal();
      setSync("saved");
    }
    render();
  } catch (e) {
    console.warn("pull falhou", e);
    setSync("error");
    toast("Não foi possível ler o Drive: " + e.message);
  }
}

function lastSeriesFor(exId) {
  const sess = [...sessoesDoPerfil()].sort((a, b) => a.data.localeCompare(b.data));
  for (let i = sess.length - 1; i >= 0; i--) {
    const ex = sess[i].exercicios.find(x => x.exercicioId === exId);
    if (ex && ex.series && ex.series.length) return { data: sess[i].data, series: ex.series };
  }
  return null;
}
function bestWeight(exId) {
  let best = null;
  for (const s of sessoesDoPerfil()) {
    const ex = s.exercicios.find(x => x.exercicioId === exId);
    if (!ex) continue;
    for (const se of ex.series) if (se.peso != null && (best == null || se.peso > best)) best = se.peso;
  }
  return best;
}
function seriesForChart(exId) {
  const pts = [];
  for (const s of [...sessoesDoPerfil()].sort((a, b) => a.data.localeCompare(b.data))) {
    const ex = s.exercicios.find(x => x.exercicioId === exId);
    if (!ex || !ex.series.length) continue;
    const ws = ex.series.map(v => v.peso).filter(v => v != null);
    if (!ws.length) continue;
    pts.push({ data: s.data, max: Math.max(...ws), avg: ws.reduce((a, b) => a + b, 0) / ws.length });
  }
  return pts;
}

/* ---------- observações ---------- */
/** histórico cronológico (mais recente primeiro) das observações de um exercício */
function obsHistoryFor(exId) {
  const out = [];
  for (const s of [...sessoesDoPerfil()].sort((a, b) => b.data.localeCompare(a.data))) {
    const ex = s.exercicios.find(x => x.exercicioId === exId);
    const o = ex && typeof ex.obs === "string" ? ex.obs.trim() : "";
    if (o) out.push({ data: s.data, obs: o });
  }

}

/* ---------- estagnação de carga ---------- */
const MS_DIA = 86400000;
/** dias inteiros entre duas datas ISO (yyyy-mm-dd), independente de fuso */
function diasEntre(isoA, isoB) {
  const a = new Date(isoA + "T12:00:00").getTime();
  const b = new Date(isoB + "T12:00:00").getTime();
  if (!isFinite(a) || !isFinite(b)) return 0;
  return Math.round((b - a) / MS_DIA);
}
/**
 * Sugestão de aumento de carga.
 * Regra: peso máximo (métrica `max`) igual há >= 15 dias, com pelo menos 2 registros.
 * - `atRef` (opcional) = data de referência (yyyy-mm-dd); se informado, só conta sessões até ela
 *   (usado na tela de treino para não contar o próprio treino sendo feito).
 * Retorna { dias, peso, desde, ate, registros } ou null.
 */
function loadStagnation(exId, atRef) {
  if (!exId) return null;
  const ref = atRef || todayISO();
  const pts = [];
  for (const s of sessoesDoPerfil()) {
    if (s.data > ref) continue;
    const ex = s.exercicios.find(x => x.exercicioId === exId);
    if (!ex || !ex.series || !ex.series.length) continue;
    const ws = ex.series.map(v => v.peso).filter(v => v != null);
    if (!ws.length) continue;
    pts.push({ data: s.data, max: Math.max(...ws) });
  }
  if (pts.length < 2) return null;
  // ordena e faz um ponto por dia (mantém o maior peso do dia)
  const porDia = new Map();
  for (const p of pts) { const cur = porDia.get(p.data); if (cur == null || p.max > cur) porDia.set(p.data, p.max); }
  const serie = [...porDia.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([data, max]) => ({ data, max }));
  const ultimo = serie[serie.length - 1];
  // assume o peso atual = última sessão registrada (sem treino em andamento nesta data)
  const pesoAtual = ultimo.max;
  // início da sequência atual: primeira sessão em que o peso atual aparece, sem alteração depois
  let inicioSeq = serie.length - 1;
  for (let i = serie.length - 2; i >= 0; i--) { if (serie[i].max !== pesoAtual) break; inicioSeq = i; }
  const registros = serie.length - inicioSeq;          // qtde de sessões com esse mesmo peso
  if (registros < 2) return null;
  const dias = diasEntre(serie[inicioSeq].data, ref);
  if (dias < 15) return null;
  return { dias, peso: pesoAtual, desde: serie[inicioSeq].data, ate: ultimo.data, registros };
}

/* ============================================================
   Treino do dia
   ============================================================ */
function lastSessionsForTreino(trId, n = 3) {
  return sessoesDoPerfil().filter(s => s.treinoId === trId).sort((a, b) => b.data.localeCompare(a.data)).slice(0, n);
}

/* Rotação fixa das fichas */
const ROTACAO = ["A", "B", "C", "D"];

/* Sessão mais recente: maior data; em empate, maior horaInicio; depois última inserida */
function ultimaSessao() {
  const arr = sessoesDoPerfil();
  let best = null, bestKey = null;
  for (let i = 0; i < arr.length; i++) {
    const s = arr[i];
    if (!s || !s.data) continue;
    const key = [String(s.data).slice(0, 10), s.horaInicio || "", i];
    if (!bestKey || key[0] > bestKey[0]
      || (key[0] === bestKey[0] && key[1] > bestKey[1])
      || (key[0] === bestKey[0] && key[1] === bestKey[1] && key[2] > bestKey[2])) {
      best = s; bestKey = key;
    }
  }
  return best;
}

/* Estado de cada ficha na tela Novo treino.
   "ult"  = verde  → última ficha treinada
   "prox" = amarelo + tag #próximo → a seguinte na rotação A→B→C→D→A
   sem entrada = neutra. Nunca as duas no mesmo id (garantido pelo else). */
function estadoFichas() {
  const map = new Map();
  const ult = ultimaSessao();
  let ultId = ult && ult.treinoId ? String(ult.treinoId).trim().toUpperCase() : null;
  const existentes = treinosDoPerfil().map(t => String(t.id).trim().toUpperCase());
  if (ultId && !existentes.includes(ultId)) ultId = null;   // sessão órfã: ignora
  if (ultId) map.set(ultId, "ult");
  // próxima na rotação fixa; sem nenhum treino, começa em A
  let prox = "A";
  if (ultId) {
    const idx = ROTACAO.indexOf(ultId);
    prox = idx >= 0 ? ROTACAO[(idx + 1) % ROTACAO.length] : "A";
  }
  // ficha da rotação inexistente no app? usa a próxima que existir
  if (!existentes.includes(prox)) {
    const start = ROTACAO.indexOf(prox);
    for (let k = 1; k <= ROTACAO.length; k++) {
      const cand = ROTACAO[(start + k) % ROTACAO.length];
      if (existentes.includes(cand)) { prox = cand; break; }
    }
  }
  if (prox !== ultId) map.set(prox, "prox");   // verde e amarelo nunca na mesma ficha
  return map;
}
